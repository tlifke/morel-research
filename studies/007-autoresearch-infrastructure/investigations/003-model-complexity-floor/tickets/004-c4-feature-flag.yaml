id: 004-c4-feature-flag
title: "C4 — add a --lines flag to the counter CLI"
summary: "Extend seeded code with a new behavior while preserving the old one."
why: >
  Tier 4 tests additive feature work on existing code: new flag, old default
  behavior intact, both verified.
claim: "Complexity floor: which model tiers clear which task tiers"
description: >
  The repository contains py/counter.py, a CLI that prints the word count of
  a file. Add support for a --lines flag given before the path that prints
  the line count instead. Without the flag, behavior must stay exactly as
  before (word count). Output is the bare number in both modes.
acceptance:
  - "python3 py/counter.py <file> still prints the word count"
  - "python3 py/counter.py --lines <file> prints the line count"
assignee_class: small-agent
agent_explanation: >
  Small feature extension with backward-compatibility constraint; tier-4
  probe. Route injected per sweep config.
