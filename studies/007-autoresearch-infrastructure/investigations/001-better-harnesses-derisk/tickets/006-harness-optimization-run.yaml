  - optimization-results.yaml records all harness variants tested (config + performance)
  - optimizer-trajectories/ directory contains detailed logs for each optimization step
  - final optimized harness saved to harness-optimized.json (or equivalent) with full config
  - "cost accounting: GPU-wallclock-seconds and frontier-API spend (if any) documented with totals"
