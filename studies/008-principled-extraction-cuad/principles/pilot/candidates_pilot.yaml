- id: g04
  statement: Governing Law covers only a clause designating the substantive law that governs the contract
    as a whole; venue, forum, jurisdiction-consent and arbitration clauses are not responsive, and neither
    is a law that governs only one section of the contract.
  trigger_guidance: Consider whenever a dispute-resolution or miscellaneous section is being read — these
    clauses frequently sit in the same paragraph as the true governing-law sentence, or replace it entirely.
  type: disambiguation
  scope:
  - Governing Law
  provenance: atticus_guidelines
  evidence:
  - Handbook, Governing Law, IS-NOT list (p.12) — venue and arbitration clauses excluded, with four worked
    counter-examples (submission to exclusive jurisdiction, inconvenient-forum waiver, People's Court
    jurisdiction, consent to Denver courts)
  - Handbook, Governing Law, IS-NOT list (p.12) — law governing the interpretation of a single section
    is excluded; CUAD treats the label as whole-contract only
  - Handbook, Governing Law, IS list (p.12) — a cross-reference to another agreement's governing-law provision
    IS responsive (span only, no answer)
  checker_sketch: 'Applicability: the contract contains at least one sentence matching a venue pattern
    (exclusive jurisdiction | submits? to the jurisdiction | venue | inconvenient forum | arbitration
    | courts located in | courts situated in) — computed from instance text alone, no gold needed. Compliance:
    no predicted Governing Law span overlaps such a sentence unless that same sentence also matches the
    governing-law pattern (govern | construed | interpreted, near "law"). Sentence segmentation on contract
    text is the only moving part and it is already needed for g01. High confidence: this is the single
    most explicitly documented rule for any pilot category, and it is exactly the confusion the study
    predicted.'
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: null
    batch_id: null
    invocation: subagent
    harness: claude-code
    source_document: CUAD Labeling Handbook (Atticus Project, 2021) + CUAD v1 Datasheet
- id: g05
  statement: A payment obligation is Revenue/Profit Sharing only when the amount varies with the counterparty's
    revenue, profit, sales, margin or units sold; fixed amounts, milestone payments, fixed-amount tiered
    schedules, cost-based or reimbursement payments are not, however they are labelled in the contract.
  trigger_guidance: Consider whenever a payment, royalty, commission or fee clause is a candidate — the
    word "royalty" is not evidence either way, the arithmetic is.
  type: disambiguation
  scope:
  - Revenue/Profit Sharing
  provenance: atticus_guidelines
  evidence:
  - Handbook, Revenue/Profit Sharing, IS list (pp.87-88) — amount must be a percentage of the other party's
    revenue/profit rather than a fixed sum; percentage-of-gross-revenue tier table given as responsive;
    per-unit fees responsive because the total fluctuates with units sold; equity/warrant consideration
    responsive by a stated CUAD-specific extension
  - Handbook, Revenue/Profit Sharing, IS-NOT list (pp.88-89) — fixed-amount milestone and fixed-amount
    tier schedules, bare references to royalty or commission, cost/reimbursement-based payments, spend
    caps, and a percentage applied to a fixed amount are all excluded
  checker_sketch: 'Applicability: the contract contains at least one sentence matching a payment pattern
    (royalty | commission | revenue | profit | margin | fee) together with either a percentage token or
    a currency amount — instance only. Compliance: every predicted Revenue/Profit Sharing span either
    (a) contains a percentage token adjacent to a revenue/profit/sales/margin term, or (b) matches a per-unit
    pattern (per unit | for each ... sold | based on the number of), or (c) matches an equity pattern
    (shares | warrant | equity interest); a span containing only a fixed currency amount with no (a)/(b)/(c)
    signal fails. Honest limitation: this is a lexical proxy for an arithmetic property. It will misjudge
    the Handbook''s own hardest negative — a percentage applied to a fixed amount — because that string
    contains a percentage token. Expect a small, one-directional false-pass rate; measure it on a hand-scored
    sample of ~20 spans before this is locked, and if it exceeds ~15% either narrow the rule to the percentage-of-revenue
    case or move this principle to hand labelling.'
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: null
    batch_id: null
    invocation: subagent
    harness: claude-code
    source_document: CUAD Labeling Handbook (Atticus Project, 2021) + CUAD v1 Datasheet
- id: g06
  statement: A clause must show on its own that a revenue or profit share exists to be responsive; machinery
    that merely administers one — reporting obligations, report timing, objection and audit process, dispute
    resolution — is not Revenue/Profit Sharing.
  trigger_guidance: Consider when a candidate sentence is about a revenue share but describes process
    rather than entitlement, or when the sentence only makes sense given a percentage stated elsewhere.
  type: constraint
  scope:
  - Revenue/Profit Sharing
  provenance: atticus_guidelines
  evidence:
  - Handbook, Revenue/Profit Sharing, IS-NOT list (p.89) — standalone-basis rule, with administration,
    dispute resolution, reporting obligations, report preparation time and audit/objection process listed
    as non-responsive because they recur in contracts with no revenue share
  - 'Handbook, Revenue/Profit Sharing, IS list (p.88) — the converse: a clause stating that one party''s
    compensation is based on the other''s revenue IS responsive even when the percentage lives in a different
    clause'
  - CUAD Datasheet III-B — the dataset labels only clauses that are responsive on a standalone basis (CC
    BY 4.0, quotable)
  checker_sketch: 'Applicability: the contract contains a sentence matching an administration pattern
    (report | statement of account | within N days of the end of each | audit | object | dispute) in the
    same sentence as a revenue/profit/royalty term — instance only. Compliance: no predicted Revenue/Profit
    Sharing span is such a sentence when it lacks the g05 entitlement signals (percentage-of-revenue,
    per-unit, equity). Programmatic but a proxy; it shares g05''s lexical weakness and the two should
    be audited on the same hand-scored sample. Distinct from g05 in the error it catches: g05 catches
    wrong-arithmetic, g06 catches right-topic-wrong-function, and the H4 confusion matrix can tell them
    apart only if they are separate ids.'
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
