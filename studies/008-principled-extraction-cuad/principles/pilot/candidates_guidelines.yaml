- id: g03
  statement: A sentence responsive to more than one category is extracted under every category it is responsive
    to; assigning it to one category does not remove it from the others.
  trigger_guidance: Consider when a single passage does two jobs at once — e.g. a purchase obligation
    that also fixes a percentage payment, or a payment schedule that also sets a volume threshold.
  type: procedure
  scope: []
  provenance: atticus_guidelines
  evidence:
  - Handbook ch.1, 'If one sentence is responsive to multiple labels' (p.5) — label it under each
  - CUAD Datasheet II-D — categories are independent except within a Group, where the same text context
    may serve two or more categories (CC BY 4.0, quotable)
  checker_sketch: 'Applicability: after normalisation, the same gold span text appears under two or more
    in-scope targets for this instance; the principle is applicable to each of those decisions. Compliance:
    the predicted span sets for those targets each contain a span whose normalised token overlap with
    the shared gold passage exceeds a fixed threshold (use the same soft-match already in Level B, threshold
    recorded as a parameter). Fully programmatic. Rare by construction, which is a feature — it is one
    of the deliberately rare principles H4 needs.'
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
