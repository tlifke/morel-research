- id: g01
  statement: Each extracted span is one complete sentence, period to period, and where the responsive
    text is a numbered subsection it includes the lead-in clause needed to make that subsection read as
    a complete sentence.
  trigger_guidance: Whenever choosing span boundaries for any category whose decision is yes/no-shaped
    (all three of the confusable trio); does not govern the date and party categories, which the Handbook
    exempts.
  type: constraint
  scope: []
  provenance: atticus_guidelines
  evidence:
  - Handbook ch.1, 'Label one sentence at a time' (p.4) — sentence defined as period-to-period; worked
    example 19.3 / 19.3.1 shows a subsection with its own terminal period is not a sentence on its own
  - CUAD Datasheet II-F — annotators select full sentences for yes/no categories, instructed 'from period
    to period' (CC BY 4.0, quotable)
  checker_sketch: 'Applicability: decision is an extraction, target is a yes/no-answer category (i.e.
    not Agreement Date / Effective Date / Expiration Date / Parties / Document Name / Governing Law-answer
    categories), and gold has at least one span. Compliance: locate each predicted span in the contract
    by exact-then-normalised match (the matcher already built for verbatim fidelity); a span passes if
    its start offset is preceded only by whitespace, a terminal punctuation mark, or a section-number
    token, and its end offset lands on terminal punctuation or a semicolon. Spans that cannot be located
    fail this check and are also already counted as not-found by the verbatim metric — report the overlap
    so the two are not double-read. Feasible with offsets we already compute. The section-number allowance
    is the fuzzy part.'
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: null
    batch_id: null
    invocation: subagent
    harness: claude-code
    source_document: CUAD Labeling Handbook (Atticus Project, 2021) + CUAD v1 Datasheet
- id: g02
  statement: When the responsive material is not contiguous in the contract — a lead-in plus one of several
    subsections, a clause plus the definition it needs, or two clauses that must be read together — the
    span concatenates only the responsive fragments, in document order, separated by the marker "<omitted>",
    and drops the intervening non-responsive text.
  trigger_guidance: Consider whenever the responsive text sits inside an enumerated list, or depends on
    a defined term or on a date stated elsewhere in the contract.
  type: procedure
  scope: []
  provenance: atticus_guidelines
  evidence:
  - Handbook ch.1, subsection rule (p.5) — worked example labels 14.2 and 14.2.10 with the marker between
    them, dropping 14.2.1-14.2.9
  - Handbook ch.1, definitions rule (p.6) — a needed definition is appended after the marker; self-evident
    defined terms are not labelled
  - CUAD Datasheet II-F — same convention, described as manual deletion of the non-responsive portion
    (CC BY 4.0, quotable)
  checker_sketch: 'Applicability: the gold span set for this decision contains at least one span containing
    the literal marker "<omitted>". Compliance: the predicted span set for that decision contains at least
    one span with the marker, AND no predicted span is a contiguous substring of the contract that spans
    both fragments (which would be the "just take the whole block" failure). Both halves are pure string
    work over data we already hold. Cheap and unambiguous. Caveat: the marker must appear in the prompt''s
    task definition or no model will ever emit it, which makes this principle a partial test of instruction-following
    rather than of legal judgement.'
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: null
    batch_id: null
    invocation: subagent
    harness: claude-code
    source_document: CUAD Labeling Handbook (Atticus Project, 2021) + CUAD v1 Datasheet
- id: g03
  statement: A sentence responsive to more than one category is extracted under every category it is responsive
    to; assigning it to one category does not remove it from the others.
  trigger_guidance: Consider when a single passage does two jobs at once — e.g. a purchase obligation
    that also fixes a percentage payment, or a payment schedule that also sets a volume threshold.
  type: procedure
  scope: []
  provenance: atticus_guidelines
  evidence:
  - Handbook ch.1, 'If one sentence is responsive to multiple labels' (p.5) — label it under each
  - CUAD Datasheet II-D — categories are independent except within a Group, where the same text context
    may serve two or more categories (CC BY 4.0, quotable)
  checker_sketch: 'Applicability: after normalisation, the same gold span text appears under two or more
    in-scope targets for this instance; the principle is applicable to each of those decisions. Compliance:
    the predicted span sets for those targets each contain a span whose normalised token overlap with
    the shared gold passage exceeds a fixed threshold (use the same soft-match already in Level B, threshold
    recorded as a parameter). Fully programmatic. Rare by construction, which is a feature — it is one
    of the deliberately rare principles H4 needs.'
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: null
    batch_id: null
