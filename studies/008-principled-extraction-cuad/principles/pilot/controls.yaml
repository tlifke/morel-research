- id: g09
  statement: The Agreement Date is the date the parties executed the agreement, so where the
    introductory paragraph names one date and the signature pages another, the signature-page
    date is the one extracted; a preamble or cover-page date is taken only when the execution
    block carries none.
  trigger_guidance: Consider whenever a contract carries a date in more than one place — the
    common case is a preamble "as of" date recited months before the parties actually signed.
  type: disambiguation
  scope:
  - Agreement Date
  provenance: atticus_guidelines
  evidence:
  - Handbook, Agreement Date, IS list (p.7) — where dates conflict the annotator is directed
    to the execution block, and to take the later of the two signature-page dates when the two
    signatories signed on different days
  - Handbook, Agreement Date, IS-NOT list (p.8) — an "as of" recital date is execution wording
    rather than the date of the contract, and the preamble is not treated as authoritative when
    an executed date exists
  checker_sketch: 'Applicability: gold marks Agreement Date present, the contract contains an
    execution block (match on IN WITNESS WHEREOF | has caused this Agreement to be executed |
    a signature line pattern), and at least one date literal appears after that block. Compliance:
    the emitted span''s located offset falls after the execution-block marker, or — when the
    two dates resolve to the same calendar day — the span text matches that day under a
    month/day/year normalisation. Programmatic given the offsets we already compute; the only
    fuzzy part is date normalisation across the corpus'' formats (11 Jan. 1998 / 1/14/02 /
    11th day of January, 1998), which the Agreement Date work in `reviews/agreement-date-check.md`
    already needs a parser for. Interaction to report separately: on contracts where both dates
    are the same day this check passes trivially, so report the conflicting-date subset as its
    own denominator rather than folding it into the headline rate.'
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: null
    batch_id: null
    invocation: subagent
    harness: claude-code
    source_document: CUAD Labeling Handbook (Atticus Project, 2021) + CUAD v1 Datasheet
- id: g10
  statement: Annotation covers the executed agreement itself; responsive text that appears only
    in an exhibit, schedule, annex or appendix appended after the signature block is not extracted,
    even where that text would be responsive had it appeared in the body.
  trigger_guidance: Consider whenever the most on-point language for a category sits in a pricing
    schedule, a statement of work or a form of guaranty attached at the end of the document.
  type: constraint
  scope: []
  provenance: atticus_guidelines
  evidence:
  - Handbook ch.1, scope of the labelling task (p.3) — the unit of annotation is the agreement
    as executed; attachments are described as reference material the annotator reads for context
  - CUAD Datasheet II-B — the corpus is a set of commercial contracts, with attached exhibits
    retained in the text for completeness rather than as annotation targets (CC BY 4.0, quotable)
  checker_sketch: 'Applicability: the contract text contains an attachment heading (a line matching
    ^\s*(EXHIBIT|SCHEDULE|ANNEX|APPENDIX)\s+[A-Z0-9] ) positioned after the execution block, and
    gold has at least one span for the target. Compliance: no emitted span''s located offset falls
    at or beyond the first such heading. Cheap — one regex over instance text plus the offsets
    the matcher already returns. Limitation worth stating: some contracts repeat the attachment
    headings in a table of contents at the front, so the heading search must start from the
    execution block rather than from character zero, and documents with no execution block
    (unsigned filed forms) are simply not applicable.'
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: null
    batch_id: null
    invocation: subagent
    harness: claude-code
    source_document: CUAD Labeling Handbook (Atticus Project, 2021) + CUAD v1 Datasheet
- id: g11
  statement: The categories that ask for a single value — Agreement Date, Governing Law, Expiration
    Date — take exactly one span per contract, the one governing the agreement as a whole; a second
    such clause later in the document is a restatement or a section-specific variant and is not
    extracted.
  trigger_guidance: Consider whenever a value has already been found and a second instance of the
    same kind appears — a choice-of-law sentence in an attached form, a term clause restated for
    one product line.
  type: constraint
  scope:
  - Agreement Date
  - Governing Law
  - Expiration Date
  provenance: atticus_guidelines
  evidence:
  - Handbook, Agreement Date, IS list (p.7) — one date per contract, with the explicit instruction
    not to label both signature dates
  - Handbook, Governing Law, IS-NOT list (p.12) — a law governing the interpretation of a single
    section is excluded; the label is whole-contract only, which leaves one designation standing
  - CUAD Datasheet II-C — the single-value categories carry a scalar answer format (date, state
    or country name), so a contract yields one answer per such category (CC BY 4.0, quotable)
  checker_sketch: 'Applicability: the target is one of the three single-value categories and gold
    marks it present. Compliance: the emitted span list has length exactly 1. Trivially computable
    from the decision row and needs no matcher at all, which makes it the cheapest check in the
    set. Note the overlap with g07, which asserts the same length test for Agreement Date alone —
    if both are locked, the Agreement Date column is double-counted and the two should either be
    merged or reported with g07''s Agreement Date share removed from this one.'
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: null
    batch_id: null
    invocation: subagent
    harness: claude-code
    source_document: CUAD Labeling Handbook (Atticus Project, 2021) + CUAD v1 Datasheet
- id: g12
  statement: Every category in scope receives a ruling on every contract, and where no responsive
    text is found the category is recorded as having no answer rather than left blank.
  trigger_guidance: Consider on any contract where a category yields nothing — the ruling of
    absence is itself the annotation and is made explicitly, not by omission.
  type: procedure
  scope: []
  provenance: atticus_guidelines
  evidence:
  - Handbook ch.1, workflow (p.4) — the annotator works the category list top to bottom on every
    contract and marks the ones with no responsive text, rather than skipping them
  - CUAD Datasheet II-E — negative examples are recorded per category per contract via the
    is_impossible flag, which is what makes the corpus usable for abstention (CC BY 4.0, quotable)
  checker_sketch: 'Applicability: every decision in every contract — the principle has no
    narrowing condition. Compliance: the decision object is present for the target and is either
    an Extraction with a non-empty span list or an AbsenceClaim, never an Extraction with an
    empty list. Reads straight off the decision row. Expected to be one of the highest-frequency
    principles in the set, which is a virtue for the citation-frequency analysis and a caution
    for the compliance headline — report it separately from the discriminating principles so it
    does not carry the aggregate.'
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
