id: 006-harness-optimization-run
title: Execute harness-optimization run under budget
claim: paper-card claims 1–2 — core replication of automatic harness adaptation
description: >
  Run the meta-agent optimizer on budget-approval task with the chosen SLM, reduced instance counts
  to stay within $5 derisk compute budget and GPU capacity. If optimizer uses frontier-model
  evals for proposal scoring or decision-making, reserve frontier-API budget for those calls.
  Log all optimizer trajectories, intermediate harness variants, and per-instance results.
  Track total spend (GPU-seconds, frontier-API calls) against derisk ceiling.
