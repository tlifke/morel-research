id: 005-hello-ts-json
title: "Hello world as JSON in TypeScript"
summary: "TypeScript file that prints a single exact JSON object."
why: >
  Exact-output probe: byte-precise stdout ({"hello":"world"}) catches agents
  that add prose, formatting, or logging around their output.
claim: "Drain derisk: small agents can meet byte-exact output contracts"
description: >
  Create ts/hello-json.ts in the working directory. Running "bun
  ts/hello-json.ts" must print exactly {"hello":"world"} on one line (no spaces,
  no extra output) and exit 0. Use JSON.stringify rather than a hand-written
  string.
acceptance:
  - "ts/hello-json.ts exists and uses JSON.stringify"
  - "bun ts/hello-json.ts prints exactly '{\"hello\":\"world\"}' and exits 0"
assignee_class: small-agent
agent_explanation: >
  Byte-exact output is a precision probe, not a reasoning probe; small-agent
  tier is correct. Routed to gemini-3.1-flash-lite so the API path covers both
  languages.
depends_on: []
produces:
  - ts/hello-json.ts
consumes: []
human_needed: []
gate: hello-world-approval
cost_ceiling_usd: 0.10
status: done
