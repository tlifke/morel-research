    with "at least", "no less than", or a stated annual minimum.
  type: disambiguation
  scope: [minimum_commitment, volume_restriction]
  provenance: savelka_confusion
  proposer:
    model: claude-opus-5
    prompt_version: proposer_v1
    batch_id: cm-sample-001
  evidence: [pair-0031, pair-0044, pair-0102]
  checker_sketch: span matched by the minimum-threshold lexicon AND gold label in
    {minimum_commitment, volume_restriction} -> applicable
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
