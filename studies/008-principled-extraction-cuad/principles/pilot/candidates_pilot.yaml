- id: d01
  statement: 'Extract the minimal expression that answers the target question, clipped out of the sentence
    that carries it, rather than the whole containing sentence.

    '
  trigger_guidance: 'Consider whenever the answer to a target is a short self-contained value — a date,
    a jurisdiction, a named amount — embedded in a longer recital or preamble sentence.

    '
  type: preference
  scope:
  - Agreement Date
  provenance: data_mined
  evidence:
  - pair-0001
  - pair-0002
  - pair-0003
  n_supporting_pairs: 3
  checker_sketch: 'Applicable when gold has a non-empty Extraction for the target and every gold span
    is (a) under 40 characters, (b) fully matched by a date regex such as \d{1,2}(st|nd|rd|th)?\s+day\s+of\s+\w+,?\s+\d{4}
    or \w+\s+\d{1,2},\s+\d{4}, and (c) a proper substring of the sentence containing it, where sentences
    are cut on /[.;]\s|\n\n/. Compliance: the emitted span set matches gold under the same length and
    regex tests rather than reproducing the enclosing sentence.

    '
  defect_argument: 'Three gold spans, three different contracts, lengths 22 / 19 / 21 characters, all
    clipped identically out of an execution recital. A single over-tight span would be a plausible annotation
    slip; three independent contracts converging on the same boundary is a convention. The Revenue/Profit
    Sharing side of these three pairs is mining noise (all three share one promiscuous span whose only
    common material is "day of"); this principle is read off the A sides only.

    '
