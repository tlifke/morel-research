- id: d10
  statement: 'The volume-threshold target needs a consequence as well as a ceiling — a higher fee,
    or the counterparty''s consent — and a bare quantity cap that states none is not responsive.

    '
  trigger_guidance: 'Consider on any clause naming a cap, ceiling or maximum: check that the
    clause also says what happens once the cap is passed, and claim absence where it does not.

    '
  type: disambiguation
  scope:
  - Volume Restriction
  provenance: data_mined
  evidence:
  - pair-0017
  - pair-0021
  n_supporting_pairs: 2
  checker_sketch: 'Applicable to a Volume Restriction decision when the contract contains a
    sentence with a quantity token (/\d|\*{3,}|\[\*+\]/) and a ceiling cue (/\bexceed|in excess
    of|no more than|\bmaximum\b/). Compliance: every emitted span also matches a consequence cue
    — /\bfee|\bprice|\bcharge|\brate/ or /\bconsent|\bapproval/ — and a span carrying the ceiling
    alone is a violation. Lexical, so it will misjudge clauses stating the consequence in the next
    sentence; check that on ~20 hand-scored spans first.

    '
  defect_argument: 'Two same-contract pairs from the Summa Four software licence, where three
    adjacent sentences of one performance specification are split between the two neighbouring
    targets. The sentence that stayed with the volume-threshold target ("There shall be fewer
    than 1 talkoff in 5 hours of voice when the detector is programmed with the recommended
    parameters", [89626:89755]) states a bare ceiling and its neighbour at [90190:90359] adds a
    parenthetical minimum and lands under the floor target instead. Read together, the pair says
    the two targets are separated by what the threshold does rather than by the words "minimum"
    and "maximum". Same-contract minimal pairs are the strongest evidence this mining produces
    and both are same-contract; the count is nonetheless only 2 and the boundary deserves a
    confirming instance from a different document before it is locked.

    '
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: proposer_v1
    batch_id: cm-003
    invocation: subagent
    harness: claude-code
    source_document: null
- id: d11
  statement: 'The span for the governing-law target ends at the named jurisdiction; the
    conflicts-of-law tail that follows is boilerplate found in documents with no such target at
    all, and is left outside the span.

    '
  trigger_guidance: 'Consider whenever the choice-of-law sentence continues past the named
    jurisdiction into a "without regard to", "notwithstanding" or "excluding its" clause — the
    responsive material has already ended.

    '
  type: preference
  scope:
  - Governing Law
  provenance: data_mined
  evidence:
  - pair-0029
  - pair-0030
  n_supporting_pairs: 2
  checker_sketch: 'Applicable to a Governing Law decision when gold marks the category present and
    the contract contains a conflicts tail (/without regard to (the )?(conflicts?|choice) of
    laws?|excluding its conflicts of laws?/i) within 200 characters of a governing-law cue.
    Compliance: no emitted span''s end offset falls at or beyond the start of that tail. Nearly
    free, since the offsets exist for the verbatim check. Tension with g01 to note: g01 exempts
    the answer-shaped categories, so the two do not collide unless g01 is widened.

    '
  defect_argument: 'Two pairs from the governing-law batch, both present-vs-absent, and the
    informative side is the same in each: the conflicts tail appears in documents where the
    target is ruled absent as readily as in documents where it is present, so it carries no
    signal about the target and the convention does not spend span on it. The Women''s Golf
    endorsement agreement is gold-absent for the target while carrying the same miscellaneous
    boilerplate register as the two annotated termination agreements. Weak on count and stated as
    such: n=2, both from one batch, and neither pair isolates the span boundary directly — this
    is read off what the two documents share rather than off a boundary contrast, and a
    boundary-level confirmation would be cheap to obtain by measuring where annotated spans end
    relative to the tail.

    '
