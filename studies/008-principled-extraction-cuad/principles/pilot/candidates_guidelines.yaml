- id: g04
  statement: Governing Law covers only a clause designating the substantive law that governs the contract
    as a whole; venue, forum, jurisdiction-consent and arbitration clauses are not responsive, and neither
    is a law that governs only one section of the contract.
  trigger_guidance: Consider whenever a dispute-resolution or miscellaneous section is being read — these
    clauses frequently sit in the same paragraph as the true governing-law sentence, or replace it entirely.
  type: disambiguation
  scope:
  - Governing Law
  provenance: atticus_guidelines
  evidence:
  - Handbook, Governing Law, IS-NOT list (p.12) — venue and arbitration clauses excluded, with four worked
    counter-examples (submission to exclusive jurisdiction, inconvenient-forum waiver, People's Court
    jurisdiction, consent to Denver courts)
  - Handbook, Governing Law, IS-NOT list (p.12) — law governing the interpretation of a single section
    is excluded; CUAD treats the label as whole-contract only
  - Handbook, Governing Law, IS list (p.12) — a cross-reference to another agreement's governing-law provision
    IS responsive (span only, no answer)
  checker_sketch: 'Applicability: the contract contains at least one sentence matching a venue pattern
    (exclusive jurisdiction | submits? to the jurisdiction | venue | inconvenient forum | arbitration
    | courts located in | courts situated in) — computed from instance text alone, no gold needed. Compliance:
    no predicted Governing Law span overlaps such a sentence unless that same sentence also matches the
    governing-law pattern (govern | construed | interpreted, near "law"). Sentence segmentation on contract
    text is the only moving part and it is already needed for g01. High confidence: this is the single
    most explicitly documented rule for any pilot category, and it is exactly the confusion the study
    predicted.'
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
