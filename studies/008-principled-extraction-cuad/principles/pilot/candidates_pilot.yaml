- id: d05
  statement: 'When two targets differ only in the direction of a threshold, assign a clause by which side
    of the threshold it binds on — a lower bound the obligated party must meet, or an upper bound above
    which supply is capped, conditioned or repriced.

    '
  trigger_guidance: 'Consider on any clause naming a quantity threshold, especially where the same quantity,
    forecast or capacity is bounded in two places in one contract.

    '
  type: disambiguation
  scope:
  - Minimum Commitment
  - Volume Restriction
  provenance: data_mined
  evidence:
  - pair-0014
  - pair-0015
  - pair-0016
  - pair-0018
  - pair-0019
  - pair-0020
  - pair-0022
  - pair-0023
  n_supporting_pairs: 8
  checker_sketch: 'Applicable to a Minimum Commitment or Volume Restriction decision when the contract
    contains a sentence with a quantity token (/\d|\*{3,}|\[\*+\]/) and a bound cue. LOWER cues: /\bminimum\b|\bat
    least\b|\bno less than\b| \bwithin\b.{0,40}%/. UPPER cues: /\bmaximum\b|\bup to\b|\bin excess of\b|
    \bexceed(ing|s)?\b|\bnot required to.{0,40}more than\b|\bno more than\b/. Compliance: spans carrying
    LOWER cues land in the Minimum Commitment decision and spans carrying UPPER cues land in the Volume
    Restriction decision; a span whose cue class contradicts the decision it appears in is a violation.
    Strengthen by also requiring, when both cue classes fire in one contract, that both decisions be Extractions.

    '
  defect_argument: 'Eight pairs across four contracts, six of them same-contract contrasts, and four of
    those near-verbatim: an identical content list headed "A minimum of:" against "Up to:" (pair-0014,
    pair-0016, pair-0018), and adjacent definitions of "Minimum Quantity" and "Maximum Quantity" differing
    by one word (pair-0015). The mechanism pairs (pair-0019 Vericel, pair-0020 MediWound) and the capacity-allocation
    pairs (pair-0022, pair-0023 Range Resources) reproduce the same split on clauses that share no vocabulary
    with the list pairs. This is the most strongly evidenced convention in the pilot and the only one
    that survives on within-contract minimal pairs alone. Excluded: pair-0017 and pair-0021, where three
    adjacent sentences of one DTMF performance specification are split across the two categories on the
    presence of the token "minimum" in a parenthetical — neither span matches either definition and the
    labels look keyword-driven.

    '
  review:
    decision: null
    reviewer: null
