<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review queue</title>
<style>
:root{
  --bg:#14161a; --panel:#1b1e24; --panel2:#222630; --line:#2f3542;
  --fg:#e6e9ef; --dim:#9aa4b6; --faint:#6c7688;
  --ok:#3fa66a; --warn:#c9973f; --bad:#c05252; --info:#5b7fc4;
  --alt:#9b6bc4; --neutral:#7e8798; --edit:#c9973f;
  --accent:#7aa2f7; --warn:#e0574f;
  font-size:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--fg);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  display:flex; flex-direction:column; overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
header{
  display:flex; align-items:center; gap:16px; padding:8px 14px;
  background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto;
}
header .title{font-weight:700; letter-spacing:.02em}
header .src{color:var(--faint); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:38vw}
.progress{display:flex; align-items:center; gap:8px; margin-left:auto}
.bar{width:180px; height:8px; background:var(--panel2); border:1px solid var(--line); border-radius:2px; overflow:hidden}
.bar>div{height:100%; background:var(--ok)}
.counts{font-size:12px; color:var(--dim)}
.counts b{color:var(--fg)}
main{flex:1 1 auto; display:flex; min-height:0}
#side{
  width:340px; flex:0 0 340px; background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0;
}
.filters{padding:8px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:6px}
.filters .row{display:flex; gap:6px}
.filters select,.filters input{
  flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:3px;
  padding:4px 6px; font-size:12px;
}
#list{overflow-y:auto; flex:1 1 auto}
.item{
  padding:7px 9px 7px 12px; border-bottom:1px solid var(--line); cursor:pointer;
  border-left:3px solid transparent; background:var(--panel);
}
.item:hover{background:var(--panel2)}
.item.sel{background:var(--panel2); border-left-color:var(--accent)}
.item .l1{display:flex; gap:6px; align-items:center; font-size:12px; color:var(--dim)}
.item .l1 .rid{color:var(--fg); font-weight:700}
.item .l2{font-size:12px; color:var(--dim); margin-top:3px; line-height:1.35;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.item.t-ok{border-left-color:var(--ok)}
.item.t-warn{border-left-color:var(--warn)}
.item.t-bad{border-left-color:var(--bad)}
.item.t-info{border-left-color:var(--info)}
.item.t-alt{border-left-color:var(--alt)}
.item.t-neutral{border-left-color:var(--neutral)}
.pill{font-size:10px; padding:1px 5px; border-radius:8px; border:1px solid var(--line); color:var(--dim); background:var(--bg)}
.pill.t-ok{color:#bdf0d2; border-color:var(--ok); background:#17331f}
.pill.t-warn{color:#f3ddb0; border-color:var(--warn); background:#332711}
.pill.t-bad{color:#f2c3c3; border-color:var(--bad); background:#361818}
.pill.t-info{color:#c8d8f7; border-color:var(--info); background:#182338}
.pill.t-alt{color:#e0cdf5; border-color:var(--alt); background:#251a33}
.pill.t-neutral{color:#d3d8e0; border-color:var(--neutral); background:#242830}
.pill.draft{color:#e2c8f5; border-color:#8a5fb8; background:#2a1c36}
#detail{flex:1 1 auto; display:flex; flex-direction:column; min-height:0; background:var(--bg)}
#record{overflow-y:auto; padding:14px 18px; flex:1 1 auto}
.rec-head{display:flex; align-items:baseline; gap:10px; margin-bottom:6px}
.rec-head .rid{font-size:18px; font-weight:700}
.rec-head .pos{color:var(--faint); font-size:12px}
.statement{
  font-size:16px; line-height:1.5; background:var(--panel); border:1px solid var(--line);
  border-left:3px solid var(--accent); padding:10px 12px; border-radius:3px; white-space:pre-wrap;
}
.meta{display:flex; flex-wrap:wrap; gap:6px 10px; margin:10px 0}
.meta .kv{font-size:12px; background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:3px 7px}
.meta .kv span{color:var(--faint)}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
.card.wide{grid-column:1 / -1}
.spanview{font-size:13px; line-height:1.6; max-height:260px; overflow-y:auto; white-space:pre-wrap;
  word-break:break-word}
.spanview .ctx{color:var(--faint)}
.spanview mark{background:#3a2f10; color:#ffe6a8; border-bottom:2px solid var(--warn); padding:1px 0}
.tblwrap{overflow-x:auto; max-height:240px; overflow-y:auto}
table.tbl{border-collapse:collapse; width:100%; font-size:12px}
table.tbl th{text-align:left; color:var(--faint); font-weight:700; border-bottom:1px solid var(--line);
  padding:3px 8px 3px 0; white-space:nowrap}
table.tbl td{padding:3px 8px 3px 0; border-bottom:1px solid var(--line); vertical-align:top;
  color:var(--fg); max-width:640px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:8px 10px}
.card h3{margin:0 0 5px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:700}
.card .body{font-size:13px; line-height:1.5; white-space:pre-wrap}
.card .hint{color:var(--faint); font-size:11px; margin-top:5px}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{font-size:12px; background:var(--panel2); border:1px solid var(--line); border-radius:3px; padding:2px 6px}
.edited{background:#332711; border-color:var(--edit)}
.was{color:var(--dim); font-size:12px; margin-top:7px; white-space:pre-wrap;
  border-left:2px solid var(--edit); padding-left:8px; line-height:1.45}
.was b{color:var(--edit); font-weight:700}
.wasin{color:var(--edit); font-size:11px}
#review{flex:0 0 auto; border-top:1px solid var(--line); background:var(--panel); padding:10px 18px 12px}
.decisions{display:flex; gap:8px; margin-bottom:8px; align-items:center; flex-wrap:wrap}
.dbtn{
  background:var(--panel2); border:1px solid var(--line); color:var(--fg);
  padding:6px 14px; border-radius:3px; cursor:pointer; font-size:13px;
}
.dbtn .k{color:var(--faint); font-size:11px; margin-left:6px}
.dbtn:hover{border-color:var(--dim)}
.dbtn.on.t-ok{background:#17331f; border-color:var(--ok); color:#bdf0d2}
.dbtn.on.t-warn{background:#332711; border-color:var(--warn); color:#f3ddb0}
.dbtn.on.t-bad{background:#361818; border-color:var(--bad); color:#f2c3c3}
.dbtn.on.t-info{background:#182338; border-color:var(--info); color:#c8d8f7}
.dbtn.on.t-alt{background:#251a33; border-color:var(--alt); color:#e0cdf5}
.dbtn.on.t-neutral{background:#242830; border-color:var(--neutral); color:#d3d8e0}
textarea{
  width:100%; background:var(--bg); border:1px solid var(--line); color:var(--fg);
  border-radius:3px; padding:7px 9px; resize:vertical; line-height:1.45;
}
#rationale{min-height:54px}
.reqline{display:flex; align-items:center; gap:10px; margin-top:7px; font-size:12px; color:var(--dim)}
.reqline .warn{color:var(--warn)}
.spacer{flex:1}
.act{background:var(--accent); color:#0d1117; border:none; padding:7px 16px; border-radius:3px; cursor:pointer; font-weight:700}
.act[disabled]{background:#3a4256; color:var(--faint); cursor:not-allowed}
.ghost{background:transparent; border:1px solid var(--line); color:var(--dim); padding:6px 12px; border-radius:3px; cursor:pointer}
#editor{display:none; margin-bottom:8px; border:1px solid var(--edit); border-radius:3px; padding:8px 10px; background:var(--panel2)}
#editor.on{display:block}
#editor label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); margin:6px 0 3px}
#editor label:first-child{margin-top:0}
#editor textarea,#editor input{width:100%; background:var(--bg); border:1px solid var(--line); border-radius:3px; padding:5px 7px; color:var(--fg)}
#toast{
  position:fixed; right:16px; top:52px; background:var(--panel2); border:1px solid var(--line);
  border-left:3px solid var(--accent); padding:8px 12px; border-radius:3px; font-size:12px;
  opacity:0; transition:opacity .15s; pointer-events:none; max-width:46vw; white-space:pre-wrap;
}
#toast.on{opacity:1}
#toast.bad{border-left-color:var(--warn)}
#help{font-size:11px; color:var(--faint); padding:6px 9px; border-top:1px solid var(--line); line-height:1.7}
kbd{background:var(--panel2); border:1px solid var(--line); border-radius:3px; padding:0 4px}
</style>
</head>
<body>
<header>
  <div class="title">REVIEW QUEUE</div>
  <div class="src" id="src"></div>
  <div class="progress">
    <div class="counts" id="counts"></div>
    <div class="bar"><div id="barfill" style="width:0%"></div></div>
    <button class="ghost" id="exportBtn">export yaml <span style="color:var(--faint)">^E</span></button>
  </div>
</header>
<main>
  <aside id="side">
    <div class="filters">
      <div class="row">
        <select id="fDecision">
          <option value="">all states</option>
          <option value="__unreviewed">unreviewed</option>
          <option value="accept">accept</option>
          <option value="edit">edit</option>
          <option value="reject">reject</option>
          <option value="defer">defer</option>
        </select>
        <select id="fFacet0"></select>
      </div>
      <div class="row">
        <select id="fFacet1"></select>
        <select id="fFacet2"></select>
      </div>
      <div class="row"><input id="fText" placeholder="search text  ( / )"></div>
    </div>
    <div id="list"></div>
    <div id="help">
      <div id="dkeys"></div>
      <kbd>j</kbd>/<kbd>k</kbd> next/prev &nbsp; <kbd>u</kbd> next unreviewed &nbsp;
      <kbd>i</kbd> focus rationale<br>
      <kbd>ctrl</kbd>+<kbd>enter</kbd> save &nbsp; <kbd>ctrl</kbd>+<kbd>e</kbd> export &nbsp;
      <kbd>esc</kbd> unfocus &nbsp; <kbd>/</kbd> search
    </div>
  </aside>
  <section id="detail">
    <div id="record"></div>
    <div id="review">
      <div id="editor"></div>
      <div class="decisions" id="decisions"></div>
      <textarea id="rationale" placeholder="rationale — required on every decision, including the benign ones"></textarea>
      <div class="reqline">
        <span id="reqmsg"></span>
        <span class="spacer"></span>
        <span id="stamp"></span>
        <button class="act" id="saveBtn">save decision</button>
      </div>
    </div>
  </section>
</main>
<div id="toast"></div>
<script>
const S = {state:null, sel:0, decision:null, edits:{}, editing:false, dirty:false};
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s==null?"":s).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function buildDecisionFilter(){
  $("fDecision").innerHTML='<option value="">all states</option>'+
    '<option value="__unreviewed">unreviewed</option>'+
    schema().decisions.map(d=>`<option value="${esc(d.name)}">${esc(d.name)}</option>`).join("");
}
function dotted(o,k){let c=o;for(const p of k.split(".")){if(c==null||typeof c!=="object")return null;c=c[p];}return c;}
function schema(){return S.state.schema;}
function records(){return S.state.records;}
function visible(){
  const d=$("fDecision").value, t=$("fText").value.toLowerCase();
  const facets=schema().facets.map((f,i)=>[f.key,$("fFacet"+i)?$("fFacet"+i).value:""]);
  return records().filter(r=>{
    const dec=r.review?r.review.decision:null;
    if(d==="__unreviewed"&&dec)return false;
    if(d&&d!=="__unreviewed"&&dec!==d)return false;
    for(const [k,v] of facets){if(v&&String(dotted(r.merged,k))!==v)return false;}
    if(t&&!JSON.stringify(r.merged).toLowerCase().includes(t))return false;
    return true;
  });
}
function current(){const v=visible();return v[Math.min(S.sel,v.length-1)]||null;}

function toast(msg,bad){
  const el=$("toast"); el.textContent=msg; el.className="on"+(bad?" bad":"");
  clearTimeout(el._t); el._t=setTimeout(()=>{el.className="";},2600);
}

function renderProgress(){
  const rs=records(), n=rs.length;
  const pending=schema().pending_decisions||[];
  const c={}; schema().decisions.forEach(d=>{c[d.name]=0;});
  rs.forEach(r=>{if(r.review)c[r.review.decision]=(c[r.review.decision]||0)+1;});
  let done=0, touched=0;
  schema().decisions.forEach(d=>{touched+=c[d.name]; if(!pending.includes(d.name))done+=c[d.name];});
  $("counts").innerHTML=`<b>${touched}</b>/${n} reviewed &nbsp; `+
    schema().decisions.filter(d=>c[d.name]>0||schema().decisions.length<=4)
      .map(d=>`${esc(d.name)} <b>${c[d.name]}</b>`).join(" · ");
  $("barfill").style.width=(n?100*done/n:0)+"%";
}

function renderList(){
  const v=visible(), cur=current();
  $("list").innerHTML=v.map((r,i)=>{
    const dec=r.review?r.review.decision:null;
    const sel=cur&&r.record_id===cur.record_id?" sel":"";
    const pills=[dec?`<span class="pill ${tone(dec)}">${esc(dec)}</span>`:"",
      (!dec&&r.draft&&r.draft.rationale)?'<span class="pill draft">draft</span>':""].join("");
    const lk=schema().list_keys||[];
    const parts=lk.length?lk.map(k=>dotted(r.merged,k)).filter(v=>v!=null&&v!=="")
      :[r.record_id];
    return `<div class="item${sel} ${dec?tone(dec):""}" data-i="${i}">
      <div class="l1"><span class="rid">${esc(parts[0])}</span>
        <span>${esc(parts.slice(1).join(" · "))}</span>
        <span style="flex:1"></span>${pills}</div>
      <div class="l2">${esc(dotted(r.merged,schema().headline_key)||"")}</div></div>`;
  }).join("")||'<div style="padding:14px;color:var(--faint)">no records match the filter</div>';
  [...document.querySelectorAll(".item")].forEach(el=>{
    el.onclick=()=>{select(parseInt(el.dataset.i,10));};
  });
  const s=document.querySelector(".item.sel"); if(s)s.scrollIntoView({block:"nearest"});
}

function fieldsBySlot(slot){return schema().fields.filter(f=>f.slot===slot);}

function renderSpan(f,m){
  const before=f.config&&f.config.before?dotted(m,f.config.before):"";
  const after=f.config&&f.config.after?dotted(m,f.config.after):"";
  return `<div class="spanview"><span class="ctx">${esc(before||"")}</span>`+
    `<mark>${esc(dotted(m,f.key)||"")}</mark>`+
    `<span class="ctx">${esc(after||"")}</span></div>`;
}

function renderRows(f,val){
  if(!Array.isArray(val)||!val.length)return '<div class="body" style="color:var(--faint)">none</div>';
  const cols=(f.config&&f.config.columns)||[...new Set(val.flatMap(o=>Object.keys(o||{})))];
  return '<div class="tblwrap"><table class="tbl"><thead><tr>'+
    cols.map(c=>`<th>${esc(c)}</th>`).join("")+"</tr></thead><tbody>"+
    val.map(row=>"<tr>"+cols.map(c=>{
      const v=dotted(row||{},c);
      return `<td>${esc(Array.isArray(v)?v.join(", "):(v==null?"":v))}</td>`;
    }).join("")+"</tr>").join("")+"</tbody></table></div>";
}

function renderKv(val){
  if(!val||typeof val!=="object")return '<div class="body">—</div>';
  return '<div class="chips">'+Object.keys(val).map(k=>
    `<span class="chip"><span style="color:var(--faint)">${esc(k)}</span> ${esc(
      Array.isArray(val[k])?val[k].join(", "):String(val[k]))}</span>`).join("")+"</div>";
}

function renderValue(f,val,m){
  if(f.kind==="span")return renderSpan(f,m);
  if(f.kind==="rows")return renderRows(f,val);
  if(f.kind==="kv")return renderKv(val);
  if(Array.isArray(val))
    return '<div class="chips">'+(val.length?val.map(x=>`<span class="chip">${esc(x)}</span>`).join(""):'<span class="chip">none</span>')+"</div>";
  return `<div class="body">${esc(val==null||val===""?"—":val)}</div>`;
}

function renderRecord(){
  const r=current();
  if(!r){$("record").innerHTML='<div style="color:var(--faint)">nothing selected</div>';
    $("decisions").innerHTML="";return;}
  const v=visible(), idx=v.indexOf(r);
  const m=r.merged, src=r.source;
  const editedKeys=Object.keys(r.edits||{});
  const stmtKey=schema().headline_key;
  let html=`<div class="rec-head"><div class="rid">${esc(r.record_id)}</div>
    <div class="pos">${idx+1} of ${v.length} shown · #${r.ordinal+1} in file</div></div>`;
  const flat=(v)=>Array.isArray(v)?(v.length?v.join(", "):"— none"):(v==null||v===""?"—":v);
  const was=(k)=>editedKeys.includes(k)
    ? `<div class="was"><b>model said:</b> ${esc(flat(dotted(src,k)))}</div>` : "";
  const headField=schema().fields.find(f=>f.slot==="headline")||{key:stmtKey,kind:"longtext"};
  html+=`<div class="statement${editedKeys.includes(stmtKey)?" edited":""}">`+
    (headField.kind==="span"?renderSpan(headField,m):esc(flat(dotted(m,stmtKey))))+"</div>";
  html+=was(stmtKey);
  html+='<div class="meta">'+fieldsBySlot("meta").map(f=>{
    const ed=editedKeys.includes(f.key);
    return `<div class="kv${ed?" edited":""}"><span>${esc(f.label)}</span> ${esc(flat(dotted(m,f.key)))}`+
      (ed?` <span class="wasin">was ${esc(flat(dotted(src,f.key)))}</span>`:"")+"</div>";
  }).join("")+"</div>";
  const cards=fieldsBySlot("body").map(f=>{
    const val=dotted(m,f.key);
    const ed=editedKeys.includes(f.key)?" edited":"";
    const wide=(f.kind==="rows"||f.kind==="span")?" wide":"";
    return `<div class="card${ed}${wide}"><h3>${esc(f.label)}</h3>${renderValue(f,val,m)}${was(f.key)}`+
      (f.hint?`<div class="hint">${esc(f.hint)}</div>`:"")+"</div>";
  });
  html+='<div class="grid">'+cards.join("")+"</div>";
  const consumed=new Set([schema().review_key,schema().id_key]);
  schema().fields.forEach(f=>{
    consumed.add(f.key.split(".")[0]);
    Object.values(f.config||{}).forEach(v=>{if(typeof v==="string")consumed.add(v);});
  });
  const unknown=Object.keys(src).filter(k=>!consumed.has(k));
  if(unknown.length)
    html+=`<div class="card" style="margin-top:10px"><h3>other fields (preserved on export)</h3>
      <div class="body">${esc(JSON.stringify(Object.fromEntries(unknown.map(k=>[k,src[k]])),null,1))}</div></div>`;
  if(r.review){
    const ef=r.review.edited_from;
    const efLine=ef?`\nedited_from: ${Object.keys(ef).join(", ")}`:"";
    html+=`<div class="card" style="margin-top:10px"><h3>current review</h3><div class="body">`+
      `<span class="pill ${tone(r.review.decision)}">${esc(r.review.decision)}</span> `+
      `${esc(r.review.reviewer)} · ${esc(r.review.date)}\n${esc(r.review.rationale)}`+
      `${esc(efLine)}</div></div>`;
  }
  $("record").innerHTML=html;
  $("record").scrollTop=0;
  renderDecisions();
  renderEditor();
  $("stamp").textContent=`${S.state.reviewer} · ${new Date().toISOString().slice(0,10)}`;
  validate();
}

function decisionSpec(name){return schema().decisions.find(d=>d.name===name)||null;}
function tone(name){const d=decisionSpec(name);return d?"t-"+d.tone:"t-neutral";}

function renderDecisions(){
  $("decisions").innerHTML=schema().decisions.map(d=>
    `<button class="dbtn ${tone(d.name)}${S.decision===d.name?" on":""}" data-d="${esc(d.name)}"`+
    (d.hint?` title="${esc(d.hint)}"`:"")+
    `>${esc(d.name)}<span class="k">${esc(d.hotkey)}</span></button>`
  ).join("");
  [...document.querySelectorAll(".dbtn")].forEach(b=>b.onclick=()=>setDecision(b.dataset.d));
}

function renderKeyHelp(){
  $("dkeys").innerHTML=schema().decisions.map(d=>
    `<kbd>${esc(d.hotkey)}</kbd> ${esc(d.name)}`).join(" &nbsp; ")+"<br>";
}

function renderEditor(){
  const box=$("editor");
  if(!schema().edit_decision||S.decision!==schema().edit_decision){
    box.className="";box.innerHTML="";return;}
  const r=current();
  box.className="on";
  box.innerHTML=schema().fields.filter(f=>f.editable).map(f=>{
    const val=S.edits[f.key]!==undefined?S.edits[f.key]:dotted(r.merged,f.key);
    const shown=Array.isArray(val)?val.join(", "):(val==null?"":val);
    const tag=f.kind==="longtext"?`<textarea rows="3" data-k="${f.key}">${esc(shown)}</textarea>`
      :`<input data-k="${f.key}" value="${esc(shown)}">`;
    return `<label>${esc(f.label)}${f.kind==="list"?" (comma separated)":""}</label>${tag}`;
  }).join("");
  [...box.querySelectorAll("[data-k]")].forEach(el=>{
    el.oninput=()=>{
      const f=schema().fields.find(x=>x.key===el.dataset.k);
      S.edits[f.key]=f.kind==="list"
        ? el.value.split(",").map(s=>s.trim()).filter(Boolean)
        : el.value;
      S.dirty=true; queueDraft(); validate();
    };
  });
}

function setDecision(d){
  S.decision=(S.decision===d)?null:d;
  const ek=schema().edit_decision;
  if(ek&&S.decision===ek&&Object.keys(S.edits).length===0){
    const r=current();
    schema().fields.filter(f=>f.editable).forEach(f=>{S.edits[f.key]=dotted(r.merged,f.key);});
  }
  if(S.decision!==ek)S.edits={};
  renderDecisions(); renderEditor(); queueDraft(); validate();
  if(S.decision)$("rationale").focus();
}

function validate(){
  const has=$("rationale").value.trim().length>0;
  const editChanged=S.decision!==schema().edit_decision||changedEdits().length>0;
  const ok=!!S.decision&&has&&editChanged;
  $("saveBtn").disabled=!ok;
  let msg="";
  if(!S.decision)msg="pick a decision";
  else if(!has)msg='<span class="warn">rationale required — a bare accept tells the writeup nothing</span>';
  else if(!editChanged)msg='<span class="warn">edit selected but nothing changed</span>';
  else msg="ready — ctrl+enter";
  $("reqmsg").innerHTML=msg;
}

function changedEdits(){
  const r=current(); if(!r)return [];
  return Object.keys(S.edits).filter(k=>
    JSON.stringify(S.edits[k])!==JSON.stringify(dotted(r.source,k)));
}

let draftTimer=null;
function queueDraft(){
  clearTimeout(draftTimer);
  draftTimer=setTimeout(async()=>{
    const r=current(); if(!r)return;
    await fetch("/api/draft",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({record_id:r.record_id,decision:S.decision,
        rationale:$("rationale").value,edits:S.edits})});
  },400);
}

function loadInto(r){
  S.decision=r.review?r.review.decision:(r.draft?r.draft.decision:null);
  S.edits=r.review?Object.assign({},r.edits):(r.draft?Object.assign({},r.draft.edits||{}):{});
  $("rationale").value=r.review?r.review.rationale:(r.draft?r.draft.rationale||"":"");
  S.dirty=false;
}

function select(i){
  const v=visible(); if(!v.length)return;
  S.sel=Math.max(0,Math.min(i,v.length-1));
  loadInto(v[S.sel]);
  renderList(); renderRecord();
}

async function refresh(keepId){
  const res=await fetch("/api/state");
  S.state=await res.json();
  $("src").textContent=S.state.source;
  if(!$("fFacet0").dataset.built){buildFacets();buildDecisionFilter();renderKeyHelp();}
  renderProgress();
  const v=visible();
  if(keepId){const i=v.findIndex(r=>r.record_id===keepId); if(i>=0)S.sel=i;}
  select(S.sel);
}

function buildFacets(){
  schema().facets.forEach((f,i)=>{
    const el=$("fFacet"+i); if(!el)return;
    const vals=[...new Set(records().map(r=>dotted(r.merged,f.key)).filter(x=>x!=null&&x!==""))].sort();
    el.innerHTML=`<option value="">all ${esc(f.label.toLowerCase())}</option>`+
      vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
    el.onchange=()=>{S.sel=0;renderList();renderRecord();};
    el.dataset.built="1";
  });
  for(let i=schema().facets.length;i<3;i++){const el=$("fFacet"+i); if(el)el.style.display="none";}
}

async function save(){
  const r=current(); if(!r||$("saveBtn").disabled)return;
  const body={record_id:r.record_id,decision:S.decision,
    rationale:$("rationale").value.trim(),edits:S.edits};
  const res=await fetch("/api/review",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok){const e=await res.json();toast("not saved: "+(e.detail||res.status),true);return;}
  toast(`${r.record_id} → ${S.decision}`);
  const id=r.record_id;
  await refresh(id);
  nextUnreviewed();
}

function nextUnreviewed(){
  const v=visible();
  for(let k=1;k<=v.length;k++){
    const i=(S.sel+k)%v.length;
    if(!v[i].review){select(i);return;}
  }
  select(Math.min(S.sel+1,v.length-1));
}

async function doExport(){
  const res=await fetch("/api/export",{method:"POST",
    headers:{"Content-Type":"application/json"},body:"{}"});
  const j=await res.json();
  toast(`exported ${j.n} records\n${j.path}`);
}

document.addEventListener("keydown",(ev)=>{
  if(!S.state)return;
  const inField=/^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement.tagName);
  if((ev.ctrlKey||ev.metaKey)&&ev.key==="Enter"){ev.preventDefault();save();return;}
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==="e"){ev.preventDefault();doExport();return;}
  if(ev.key==="Escape"){document.activeElement.blur();return;}
  if(inField)return;
  const nav={j:()=>select(S.sel+1),k:()=>select(S.sel-1),u:nextUnreviewed,
    i:()=>$("rationale").focus(),"/":()=>$("fText").focus()};
  const clash=schema().decisions.filter(d=>d.hotkey in nav).map(d=>d.name);
  if(clash.length)console.warn("decision hotkey clashes with navigation:",clash);
  schema().decisions.forEach(d=>{if(d.hotkey&&!(d.hotkey in nav))nav[d.hotkey]=()=>setDecision(d.name);});
  const fn=nav[ev.key];
  if(fn){ev.preventDefault();fn();}
});
$("rationale").addEventListener("input",()=>{S.dirty=true;queueDraft();validate();});
$("saveBtn").onclick=save;
$("exportBtn").onclick=doExport;
$("fDecision").onchange=()=>{S.sel=0;renderList();renderRecord();};
$("fText").oninput=()=>{S.sel=0;renderList();renderRecord();};
window.addEventListener("beforeunload",()=>{
  const r=current();
  if(r&&S.dirty)navigator.sendBeacon("/api/draft",new Blob([JSON.stringify(
    {record_id:r.record_id,decision:S.decision,rationale:$("rationale").value,edits:S.edits})],
    {type:"application/json"}));
});
refresh();
</script>
</body>
</html>
