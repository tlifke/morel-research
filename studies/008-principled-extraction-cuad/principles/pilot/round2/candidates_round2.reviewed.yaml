  - pair-0027
  checker_sketch: 'Applicable to an Agreement Date decision when gold is_impossible is true
    for that category AND the contract''s first 2,000 characters contain a date literal (/\w+\s+\d{1,2},\s+\d{4}|\d{1,2}\/\d{1,2}\/\d{2,4}/)
