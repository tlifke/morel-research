- id: g08
  statement: A partially redacted or blank agreement date is still an Agreement Date extraction, recorded
    with the unknown components bracketed rather than ruled absent; absence is claimed only when no agreement
    date appears in the introductory paragraph, on the cover page, or on the signature page.
  trigger_guidance: Consider when the date position exists but the value is missing — blanks, underscores,
    asterisks, an empty day slot, or a date phrase interrupted by a redaction marker.
  type: absence
  scope:
  - Agreement Date
  provenance: atticus_guidelines
  evidence:
  - Handbook, Agreement Date, IS list (p.7) — a redacted date takes the bracketed answer format rather
    than no answer, which presupposes the span is still labelled
  - CUAD Datasheet II-F — redactions appear as asterisks, underscores or blanks and the answers reflect
    them, with a worked example turning a blank day into a bracketed component (CC BY 4.0, quotable)
  checker_sketch: 'Applicability: the contract''s first ~3000 characters, or its signature block, contain
    a date-shaped construction with a missing component — regexes for `this ___ day of`, `\b(19|20)\d\d\b`
    adjacent to `_{2,}` or `\*{2,}` or `\[\s*\]`, and a bare comma or blank sitting where a date should
    follow an execution verb. Instance-only, no gold needed. Compliance: the Agreement Date decision is
    an Extraction rather than an AbsenceClaim. Trivially computable from the decision row. LOUD FLAG FOR
    TYLER: this principle may disagree with gold. The study plan assumes CUAD marks such contracts gold-absent
    for Agreement Date (the "signed on , in Hong Kong" case). The Handbook prescribes the opposite. If
    both are true, then following the documented rule costs answer accuracy, and compliance and correctness
    point in opposite directions on exactly these instances. That is a real and interesting measurement
    — it is the documentation-versus-practice divergence the two-arm design exists to find — but it must
    be a decision Tyler makes knowingly, not a silent scoring conflict. Check the sign of the disagreement
    on harness_val before locking.'
