version: frozen-2026-08-15

tokenizer:
  id: Qwen/Qwen3-8B
  rationale: >
    n_tokens must come from a real tokenizer because every
    infeasible_at_length determination and every length bucket in the study
    depends on it. The Qwen3 BPE tokenizer is shared across the Qwen3 family,
    so it is the tokenizer of the study's ~8B arm (qwen3.5:8b served by
    ollama) and a reasonable common yardstick for the other arms. Counts are
    without special tokens: they measure the contract, not a prompt.
  add_special_tokens: false

splits:
  seed: 20260815
  holdout:
    source: official test.json
    n: 102
    note: 102 official test contracts, untouched until gate G4.
  dev:
    source: official train (CUADv1 minus test.json titles)
    n: 40
    stratify:
      - key: length_bucket
        priority: primary
        match: holdout
        note: >
          Dev's length-bucket proportions are matched to the HOLDOUT split's,
          not to the official-train pool dev is drawn from. Rationale in
          plans/decisions.md D-13. Bucket targets are holdout proportions
          scaled to n, with largest-remainder rounding.
      - key: positive_count_tercile
        priority: secondary
        match: train_pool_within_bucket
        note: >
          Balanced WITHIN each length bucket, proportional to that bucket's
          tercile composition in the official-train pool, largest-remainder
          rounding.
    priority_rule: >
      With n=40 the two keys cannot both be satisfied exactly. Length bucket
      wins: length is the axis H5 rests on, positive-count is not.
    note: >
      Tercile edges are computed over all 41 CUAD categories, not over the
      provisional 12-category subset, so the dev split stays valid if inv 002
      changes the subset. Sampling within a (bucket, tercile) cell is uniform
      without replacement under the seed above.
  selection:
    source: official train minus dev minus exclusions (the 364-contract ft_train pool)
    n: 60
    seed: 20260816
    category_floor: 5
    stratify:
      - key: subset_category_positive_floor
        priority: primary
        note: >
          Every one of the 12 subset categories must have at least
          `category_floor` POSITIVE contracts in the split. Purpose is
          statistical power for a per-principle A/B test, per plans/splits.md;
          a principle scoped to a rare category can only show an effect on
          contracts where that category is positive. Floor rationale and the
          detectable-effect consequences are in INV1-D8.
      - key: length_bucket
        priority: secondary
        match: ft_train_pool
        note: >
          Length spread is a secondary key, matched to the 364-contract pool
          the split is carved from (NOT to holdout — that is dev's job, D-13).
          Applied twice: to spread the floor draws across buckets where the
          category's positives allow, and to allocate the remaining slots.
    priority_rule: >
      Floor first, always. Length allocation is computed against the floor
      picks already made and absorbs the imbalance they create.
  confirmation:
    source: the ft_train pool minus selection
    n: 40
    seed: 20260817
    category_floor: 4
    stratify: same keys and priority as selection, drawn from what selection left
    note: >
      Mirrors selection's coverage so a principle is confirmed on the same kind
      of evidence it was selected on. The floor is 4 rather than 5 because
      Source Code Escrow has only 11 positives in the pool; see INV1-D8 for
      what that costs and what it means for what can be concluded there.
  ft_train:
    source: official train minus dev minus exclusions minus selection minus confirmation
    note: Reserved for Phase 2. Not read by Phase 1.

exclusions:
  note: >
    Contracts removed from ft_train because their CONTENT duplicates a contract
    in holdout or dev under a different title, which title-based disjointness
    cannot catch. Evidence and the containment figures are in
    reviews/split-contamination-check.md. Applied AFTER dev sampling, so the
    seed, the sampling procedure, the dev membership and the D-13 length
    profile are all unchanged; only the ft_train pool shrinks.
  contract_ids:
    - id: "WOMENSGOLFUNLIMITEDINC_03_29_2000-EX-10.13-ENDORSEMENT AGREEMENT - Intellectual Property Rights                 Confidentiality and Non-Use Obligations Agreement"
      reason: >-
        contained verbatim WITHIN a holdout contract (containment 1.000): this
        excluded entry is the 7,042-char IP/confidentiality annex, a substring
        of the 32,371-char holdout filing WOMENSGOLFUNLIMITEDINC_03_29_2000-EX-10.13-ENDORSEMENT
        AGREEMENT; it ends at exhibit marker A-2 and carries no signing date
      twin_split: holdout
    - id: "IdeanomicsInc_20160330_10-K_EX-10.26_9512211_EX-10.26_Content License Agreement"
      reason: >-
        re-filing of a holdout contract (containment 0.946, gold agrees on all
        12): this excluded 10-K entry is 40,866 chars against the 35,189-char
        holdout 8-K entry; neither is a substring of the other
      twin_split: holdout
    - id: "ADUROBIOTECH,INC_06_02_2020-EX-10.7-CONSULTING AGREEMENT"
      reason: >-
        byte-identical to a dev contract (containment 1.000): both entries are
        12,020 chars and each is a substring of the other; the dev twin is
        ADUROBIOTECH,INC_06_02_2020-EX-10.7-CONSULTING AGREEMENT(1)
      twin_split: dev
    - id: "ARMSTRONGFLOORING,INC_01_07_2019-EX-10.2-INTELLECTUAL PROPERTY AGREEMENT"
      reason: >-
        re-filing of a dev contract (containment 0.975): this excluded entry is
        69,759 chars against the 56,858-char dev entry
        ArmstrongFlooringInc_20190107_8-K_EX-10.2_11471795_EX-10.2_Intellectual
        Property Agreement; neither is a substring of the other
      twin_split: dev

split_clustering:
  shingle_n: 5
  jaccard_threshold: 0.40
  containment_threshold: 0.60
  scope: ft_train_pool_internal
  note: >
    Carving selection and confirmation out of ft_train promotes ft_train's
    INTERNAL near-duplicate clusters into cross-split pairs, which the
    contamination guard then fails on (it did, on the
    ChinaRealEstate/Leju Content License cluster at containment 0.989). So
    before carving, the 364-contract pool is clustered by 5-gram
    containment/Jaccard and every contract in a multi-member cluster is bound
    to ft_train — clusters are indivisible and are assigned wholesale to the
    Phase-2 pool. Only cluster singletons are eligible for selection and
    confirmation.

    These thresholds are deliberately STRICTER than contamination_guard's.
    The guard is a fail condition; this is the preventive rule, and the gap
    between the two pairs of numbers (0.60 vs 0.80 containment, 0.40 vs 0.60
    Jaccard) is exactly the headroom the build retains. Binding at the guard's
    own thresholds would have left a legal cross-split pair at containment
    0.783 against a 0.80 fail line.

contamination_guard:
  shingle_n: 5
  jaccard_threshold: 0.60
  containment_threshold: 0.80
  scope: cross_split
  note: >
    Post-split assertion over the final dev/holdout/ft_train assignment. Fails
    the build if any CROSS-SPLIT pair exceeds either threshold. Thresholds are
    calibrated in reviews/split-contamination-check.md: the highest legitimate
    cross-split pair in CUAD sits at containment 0.529, and nothing in the
    corpus falls between 0.53 and 0.83 on either metric. This runs alongside
    the title-based disjointness assertion, not instead of it — they catch
    different failures.

length_buckets:
  unit: tokens
  edges: [4000, 8000, 16000]
  labels: ["<=4k", "4k-8k", "8k-16k", ">16k"]
