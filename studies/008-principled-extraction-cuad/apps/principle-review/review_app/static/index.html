<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review queue</title>
<style>
:root{
  --bg:#14161a; --panel:#1b1e24; --panel2:#222630; --line:#2f3542;
  --fg:#e6e9ef; --dim:#9aa4b6; --faint:#6c7688;
  --ok:#3fa66a; --warn:#c9973f; --bad:#c05252; --info:#5b7fc4;
  --alt:#9b6bc4; --neutral:#7e8798; --edit:#c9973f;
  --accent:#7aa2f7; --warn:#e0574f;
  font-size:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--fg);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  display:flex; flex-direction:column; overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
header{
  display:flex; align-items:center; gap:16px; padding:8px 14px;
  background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto;
}
header .title{font-weight:700; letter-spacing:.02em}
header .src{color:var(--faint); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:38vw}
.progress{display:flex; align-items:center; gap:8px; margin-left:auto}
.bar{width:180px; height:8px; background:var(--panel2); border:1px solid var(--line); border-radius:2px; overflow:hidden}
.bar>div{height:100%; background:var(--ok)}
.counts{font-size:12px; color:var(--dim)}
.counts b{color:var(--fg)}
main{flex:1 1 auto; display:flex; min-height:0}
#side{
  width:340px; flex:0 0 340px; background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0;
}
.filters{padding:8px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:6px}
.filters .row{display:flex; gap:6px}
.filters select,.filters input{
  flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:3px;
  padding:4px 6px; font-size:12px;
}
#list{overflow-y:auto; flex:1 1 auto}
.item{
  padding:7px 9px 7px 12px; border-bottom:1px solid var(--line); cursor:pointer;
  border-left:3px solid transparent; background:var(--panel);
}
.item:hover{background:var(--panel2)}
.item.sel{background:var(--panel2); border-left-color:var(--accent)}
.item .l1{display:flex; gap:6px; align-items:center; font-size:12px; color:var(--dim)}
.item .l1 .rid{color:var(--fg); font-weight:700}
.item .l2{font-size:12px; color:var(--dim); margin-top:3px; line-height:1.35;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.item.t-ok{border-left-color:var(--ok)}
.item.t-warn{border-left-color:var(--warn)}
.item.t-bad{border-left-color:var(--bad)}
.item.t-info{border-left-color:var(--info)}
.item.t-alt{border-left-color:var(--alt)}
.item.t-neutral{border-left-color:var(--neutral)}
.pill{font-size:10px; padding:1px 5px; border-radius:8px; border:1px solid var(--line); color:var(--dim); background:var(--bg)}
.pill.t-ok{color:#bdf0d2; border-color:var(--ok); background:#17331f}
.pill.t-warn{color:#f3ddb0; border-color:var(--warn); background:#332711}
.pill.t-bad{color:#f2c3c3; border-color:var(--bad); background:#361818}
.pill.t-info{color:#c8d8f7; border-color:var(--info); background:#182338}
.pill.t-alt{color:#e0cdf5; border-color:var(--alt); background:#251a33}
.pill.t-neutral{color:#d3d8e0; border-color:var(--neutral); background:#242830}
.pill.draft{color:#e2c8f5; border-color:#8a5fb8; background:#2a1c36}
#detail{flex:1 1 auto; display:flex; flex-direction:column; min-height:0; background:var(--bg)}
#record{overflow-y:auto; padding:14px 18px; flex:1 1 auto}
.rec-head{display:flex; align-items:baseline; gap:10px; margin-bottom:6px}
.rec-head .rid{font-size:18px; font-weight:700}
.rec-head .pos{color:var(--faint); font-size:12px}
.statement{
  font-size:16px; line-height:1.5; background:var(--panel); border:1px solid var(--line);
  border-left:3px solid var(--accent); padding:10px 12px; border-radius:3px; white-space:pre-wrap;
}
.meta{display:flex; flex-wrap:wrap; gap:6px 10px; margin:10px 0}
.meta .kv{font-size:12px; background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:3px 7px}
.meta .kv span{color:var(--faint)}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
.card.wide{grid-column:1 / -1}
.spanview{font-size:13px; line-height:1.6; max-height:260px; overflow-y:auto; white-space:pre-wrap;
  word-break:break-word}
.spanview .ctx{color:var(--faint)}
.spanview mark{background:#3a2f10; color:#ffe6a8; border-bottom:2px solid var(--warn); padding:1px 0}
.tblwrap{overflow-x:auto; max-height:240px; overflow-y:auto}
table.tbl{border-collapse:collapse; width:100%; font-size:12px}
table.tbl th{text-align:left; color:var(--faint); font-weight:700; border-bottom:1px solid var(--line);
  padding:3px 8px 3px 0; white-space:nowrap}
table.tbl td{padding:3px 8px 3px 0; border-bottom:1px solid var(--line); vertical-align:top;
  color:var(--fg); max-width:640px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:8px 10px}
.card h3{margin:0 0 5px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:700}
.helpbtn{
  margin-left:7px; font-size:10px; letter-spacing:0; text-transform:none; cursor:pointer;
  background:var(--panel2); border:1px solid var(--accent); color:var(--accent);
  border-radius:8px; padding:1px 7px; white-space:nowrap;
}
.helpbtn:hover{background:#1a2135}
.helpbtn.on{background:var(--accent); color:#0d1117; border-color:var(--accent)}
.helptext{
  display:none; font-size:12px; line-height:1.55; color:var(--fg); background:var(--panel2);
  border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:3px; padding:7px 9px; margin:0 0 8px;
}
.helptext.on{display:block}
.ev{display:flex; flex-direction:column; gap:9px}
.ev-cite{font-size:12.5px; line-height:1.5; color:var(--fg); border-left:2px solid var(--line); padding-left:9px}
.ev-cite.missing{border-left-color:var(--bad); color:var(--dim)}
.pair{border:1px solid var(--line); border-radius:3px; background:var(--bg)}
.pair-head{
  display:flex; flex-wrap:wrap; gap:5px 10px; align-items:center;
  padding:5px 8px; border-bottom:1px solid var(--line); font-size:11px; color:var(--dim);
  background:var(--panel2);
}
.pair-head .pid{color:var(--fg); font-weight:700; font-size:12px}
.pair-head .contrast{color:var(--faint)}
.pair-body{display:grid; grid-template-columns:1fr 24px 1fr; align-items:stretch}
.side{padding:7px 9px; min-width:0}
.side.right{border-left:1px solid var(--line)}
.vs{
  display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--faint);
  border-left:1px solid var(--line); border-right:1px solid var(--line); background:var(--panel);
}
.side-label{
  font-size:13px; font-weight:700; padding:2px 6px; border-radius:3px; display:inline-block;
  background:var(--panel2); border:1px solid var(--line); color:var(--dim);
}
.side-label.differs{border-color:var(--accent); color:#cfe0ff; background:#1a2135}
.side-label.absent{border-color:var(--bad); color:#f2c3c3; background:#361818}
.side-meta{font-size:10.5px; color:var(--faint); margin-top:4px; line-height:1.5; word-break:break-all}
.side-text{
  font-size:12.5px; line-height:1.55; margin-top:6px; white-space:pre-wrap; word-break:break-word;
  max-height:150px; overflow-y:auto; border-left:2px solid var(--line); padding-left:8px;
}
.side-ctx{margin-top:5px; font-size:11px; color:var(--faint); line-height:1.5;
  max-height:100px; overflow-y:auto; white-space:pre-wrap; word-break:break-word;
  border-left:2px dashed var(--line); padding-left:8px}
.fp{border:1px solid var(--line); border-left:3px solid var(--ok); background:var(--panel);
  border-radius:3px; padding:9px 12px 11px; margin:12px 0 2px}
.fp.empty{border-left-color:var(--neutral); color:var(--faint)}
.fp-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px}
.fp-head h3{margin:0; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--fg); font-weight:700}
.fp-head .prov{font-size:11px; color:var(--faint)}
.fp-stats{display:flex; flex-wrap:wrap; gap:10px; margin-top:9px}
.stat{flex:1 1 150px; background:var(--panel2); border:1px solid var(--line); border-radius:3px; padding:7px 10px}
.stat .num{font-size:26px; font-weight:700; line-height:1.1; color:var(--fg)}
.stat .lbl{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-top:3px}
.stat .sub{font-size:11px; color:var(--dim); margin-top:4px; line-height:1.4}
.stat.flag{border-color:var(--warn)}
.stat.flag .num{color:#f3ddb0}
.fp-sec{margin-top:10px}
.fp-sec h4{margin:0 0 5px; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:700}
.dist{display:flex; flex-direction:column; gap:3px}
.dist .row{display:grid; grid-template-columns:minmax(90px,1.2fr) 3fr minmax(96px,auto); gap:8px; align-items:center; font-size:11.5px}
.dist .key{color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dist .track{height:10px; background:var(--panel2); border:1px solid var(--line); border-radius:2px; overflow:hidden}
.dist .fill{height:100%; background:var(--info)}
.dist .val{color:var(--fg); text-align:right; font-variant-numeric:tabular-nums}
.fp-note{font-size:12px; color:var(--dim); margin-top:9px; line-height:1.5; white-space:pre-wrap}
.fp-more{font-size:12px; border:1px solid var(--line); border-radius:3px; margin-bottom:4px; background:var(--bg)}
.fp-more>summary{cursor:pointer; padding:3px 8px; color:var(--dim)}
.fp-more>.body{max-height:220px; overflow:auto; padding:4px 10px 8px; font-size:11.5px; color:var(--dim)}
.xs,.cr{border:1px solid var(--line); background:var(--panel); border-radius:3px;
  padding:9px 12px 11px; margin:12px 0 2px}
.xs{border-left:3px solid var(--info)}
.cr{border-left:3px solid var(--alt)}
.xs.st-corroborated{border-left-color:var(--ok)}
.xs.st-contradicted{border-left-color:var(--bad)}
.xs.st-silent{border-left-color:var(--neutral)}
.xs.empty,.cr.empty{border-left-color:var(--bad)}
.blk{margin-top:10px}
.blk h4{margin:0 0 4px; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--faint); font-weight:700}
.blk .t{font-size:12.5px; line-height:1.55; white-space:pre-wrap; color:var(--fg)}
.blk.claim .t{background:var(--panel2); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:3px; padding:7px 9px}
.blk.quant .t{background:var(--panel2); border:1px solid var(--line); border-left:3px solid var(--info);
  border-radius:3px; padding:7px 9px; font-variant-numeric:tabular-nums}
.blk.silence .t{background:var(--panel2); border:1px solid var(--neutral); border-left:3px solid var(--neutral);
  border-radius:3px; padding:7px 9px}
.blk .lead{font-size:11.5px; color:var(--dim); line-height:1.5; margin-bottom:5px}
.cr-cols{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px;
  margin-top:10px; align-items:start}
@media (max-width:1180px){.cr-cols{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--bg); border:1px solid var(--line); border-radius:3px; padding:8px 10px;
  min-width:0}
.col.att{border-left:3px solid var(--bad)}
.col.def{border-left:3px solid var(--ok)}
.col h4{margin:0 0 3px; font-size:11.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--fg); font-weight:700}
.col .lead{font-size:11px; color:var(--faint); line-height:1.5; margin-bottom:8px}
.obj{border:1px solid var(--line); border-left:3px solid var(--neutral); border-radius:3px;
  background:var(--panel); padding:6px 9px 8px; margin-bottom:8px}
.obj.c-strong{border-left-color:var(--bad); background:#241a1a}
.obj.c-moderate{border-left-color:var(--warn)}
.obj.c-weak{border-left-color:var(--neutral); opacity:.78}
.obj.c-could_not_break{border-left-color:var(--ok)}
.obj-head{display:flex; flex-wrap:wrap; gap:5px 8px; align-items:center}
.obj-head .axis{color:var(--fg); font-weight:700; font-size:12px}
.obj .claim{font-size:12.5px; line-height:1.5; margin-top:5px; white-space:pre-wrap}
.obj .q{font-size:11.5px; color:var(--dim); margin-top:6px; line-height:1.5;
  border-left:2px solid var(--line); padding-left:8px; white-space:pre-wrap;
  font-variant-numeric:tabular-nums}
.obj .cx{margin-top:6px}
.obj .cx h5{margin:0 0 3px; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--faint); font-weight:700}
.def-text{font-size:13px; line-height:1.6; white-space:pre-wrap; color:var(--fg)}
.card .body{font-size:13px; line-height:1.5; white-space:pre-wrap}
.card .hint{color:var(--faint); font-size:11px; margin-top:5px}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{font-size:12px; background:var(--panel2); border:1px solid var(--line); border-radius:3px; padding:2px 6px}
.edited{background:#332711; border-color:var(--edit)}
.was{color:var(--dim); font-size:12px; margin-top:7px; white-space:pre-wrap;
  border-left:2px solid var(--edit); padding-left:8px; line-height:1.45}
.was b{color:var(--edit); font-weight:700}
.wasin{color:var(--edit); font-size:11px}
#review{flex:0 0 auto; border-top:1px solid var(--line); background:var(--panel); padding:10px 18px 12px}
.decisions{display:flex; gap:8px; margin-bottom:8px; align-items:center; flex-wrap:wrap}
.dbtn{
  background:var(--panel2); border:1px solid var(--line); color:var(--fg);
  padding:6px 14px; border-radius:3px; cursor:pointer; font-size:13px;
}
.dbtn .k{color:var(--faint); font-size:11px; margin-left:6px}
.dbtn:hover{border-color:var(--dim)}
.dbtn[disabled]{opacity:.4; cursor:not-allowed}
.dbtn.on.t-ok{background:#17331f; border-color:var(--ok); color:#bdf0d2}
.dbtn.on.t-warn{background:#332711; border-color:var(--warn); color:#f3ddb0}
.dbtn.on.t-bad{background:#361818; border-color:var(--bad); color:#f2c3c3}
.dbtn.on.t-info{background:#182338; border-color:var(--info); color:#c8d8f7}
.dbtn.on.t-alt{background:#251a33; border-color:var(--alt); color:#e0cdf5}
.dbtn.on.t-neutral{background:#242830; border-color:var(--neutral); color:#d3d8e0}
textarea{
  width:100%; background:var(--bg); border:1px solid var(--line); color:var(--fg);
  border-radius:3px; padding:7px 9px; resize:vertical; line-height:1.45;
}
#rationale{min-height:54px}
.reqline{display:flex; align-items:center; gap:10px; margin-top:7px; font-size:12px; color:var(--dim)}
.reqline .warn{color:var(--warn)}
.spacer{flex:1}
.act{background:var(--accent); color:#0d1117; border:none; padding:7px 16px; border-radius:3px; cursor:pointer; font-weight:700}
.act[disabled]{background:#3a4256; color:var(--faint); cursor:not-allowed}
.ghost{background:transparent; border:1px solid var(--line); color:var(--dim); padding:6px 12px; border-radius:3px; cursor:pointer}
#editor{display:none; margin-bottom:8px; border:1px solid var(--edit); border-radius:3px; padding:8px 10px; background:var(--panel2)}
#editor.on{display:block}
#editor label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); margin:6px 0 3px}
#editor label:first-child{margin-top:0}
#editor textarea,#editor input{width:100%; background:var(--bg); border:1px solid var(--line); border-radius:3px; padding:5px 7px; color:var(--fg)}
#toast{
  position:fixed; right:16px; top:52px; background:var(--panel2); border:1px solid var(--line);
  border-left:3px solid var(--accent); padding:8px 12px; border-radius:3px; font-size:12px;
  opacity:0; transition:opacity .15s; pointer-events:none; max-width:46vw; white-space:pre-wrap;
}
#toast.on{opacity:1}
#toast.bad{border-left-color:var(--warn)}
#help{font-size:11px; color:var(--faint); padding:6px 9px; border-top:1px solid var(--line); line-height:1.7}
kbd{background:var(--panel2); border:1px solid var(--line); border-radius:3px; padding:0 4px}
</style>
</head>
<body>
<header>
  <div class="title">REVIEW QUEUE</div>
  <div class="src" id="src"></div>
  <div class="progress">
    <div class="counts" id="counts"></div>
    <div class="bar"><div id="barfill" style="width:0%"></div></div>
    <label class="ghost" style="cursor:pointer" title="Decision buttons stay disabled until a rationale is typed. Applies to every decision equally — it changes the order of the same two required steps, nothing else. Off by default.">
      <input type="checkbox" id="rationaleFirst" style="vertical-align:-1px"> rationale first
    </label>
    <button class="ghost" id="exportBtn">export yaml <span style="color:var(--faint)">^E</span></button>
  </div>
</header>
<main>
  <aside id="side">
    <div class="filters">
      <div class="row">
        <select id="fDecision">
          <option value="">all states</option>
          <option value="__unreviewed">unreviewed</option>
          <option value="accept">accept</option>
          <option value="edit">edit</option>
          <option value="reject">reject</option>
          <option value="defer">defer</option>
          <option value="unclear">unclear</option>
        </select>
        <select id="fFacet0"></select>
      </div>
      <div class="row">
        <select id="fFacet1"></select>
        <select id="fFacet2"></select>
      </div>
      <div class="row"><input id="fText" placeholder="search text  ( / )"></div>
    </div>
    <div id="list"></div>
    <div id="help">
      <div id="dkeys"></div>
      <kbd>j</kbd>/<kbd>k</kbd> next/prev &nbsp; <kbd>u</kbd> next unreviewed &nbsp;
      <kbd>i</kbd> focus rationale<br>
      <kbd>ctrl</kbd>+<kbd>enter</kbd> save &nbsp; <kbd>ctrl</kbd>+<kbd>e</kbd> export &nbsp;
      <kbd>esc</kbd> unfocus &nbsp; <kbd>/</kbd> search
    </div>
  </aside>
  <section id="detail">
    <div id="record"></div>
    <div id="review">
      <div id="editor"></div>
      <div class="decisions" id="decisions"></div>
      <textarea id="rationale" placeholder="rationale — required on every decision, including the benign ones"></textarea>
      <div class="reqline">
        <span id="reqmsg"></span>
        <span class="spacer"></span>
        <span id="stamp"></span>
        <button class="act" id="saveBtn">save decision</button>
      </div>
    </div>
  </section>
</main>
<div id="toast"></div>
<script>
const S = {state:null, sel:0, decision:null, edits:{}, editing:false, dirty:false};
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s==null?"":s).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function buildDecisionFilter(){
  $("fDecision").innerHTML='<option value="">all states</option>'+
    '<option value="__unreviewed">unreviewed</option>'+
    schema().decisions.map(d=>`<option value="${esc(d.name)}">${esc(d.name)}</option>`).join("");
}
function dotted(o,k){let c=o;for(const p of k.split(".")){if(c==null||typeof c!=="object")return null;c=c[p];}return c;}
function schema(){return S.state.schema;}
function records(){return S.state.records;}
function visible(){
  const d=$("fDecision").value, t=$("fText").value.toLowerCase();
  const facets=schema().facets.map((f,i)=>[f.key,$("fFacet"+i)?$("fFacet"+i).value:""]);
  return records().filter(r=>{
    const dec=r.review?r.review.decision:null;
    if(d==="__unreviewed"&&dec)return false;
    if(d&&d!=="__unreviewed"&&dec!==d)return false;
    for(const [k,v] of facets){if(v&&String(dotted(r.merged,k))!==v)return false;}
    if(t&&!JSON.stringify(r.merged).toLowerCase().includes(t))return false;
    return true;
  });
}
function current(){const v=visible();return v[Math.min(S.sel,v.length-1)]||null;}

function toast(msg,bad){
  const el=$("toast"); el.textContent=msg; el.className="on"+(bad?" bad":"");
  clearTimeout(el._t); el._t=setTimeout(()=>{el.className="";},2600);
}

function renderProgress(){
  const rs=records(), n=rs.length;
  const pending=schema().pending_decisions||[];
  const c={}; schema().decisions.forEach(d=>{c[d.name]=0;});
  rs.forEach(r=>{if(r.review)c[r.review.decision]=(c[r.review.decision]||0)+1;});
  let done=0, touched=0;
  schema().decisions.forEach(d=>{touched+=c[d.name]; if(!pending.includes(d.name))done+=c[d.name];});
  $("counts").innerHTML=`<b>${touched}</b>/${n} reviewed &nbsp; `+
    schema().decisions.map(d=>`${esc(d.name)} <b>${c[d.name]}</b>`).join(" · ");
  $("barfill").style.width=(n?100*done/n:0)+"%";
}

function renderList(){
  const v=visible(), cur=current();
  $("list").innerHTML=v.map((r,i)=>{
    const dec=r.review?r.review.decision:null;
    const sel=cur&&r.record_id===cur.record_id?" sel":"";
    const pills=[dec?`<span class="pill ${tone(dec)}">${esc(dec)}</span>`:"",
      (!dec&&r.draft&&r.draft.rationale)?'<span class="pill draft">draft</span>':""].join("");
    const lk=schema().list_keys||[];
    const parts=lk.length?lk.map(k=>dotted(r.merged,k)).filter(v=>v!=null&&v!=="")
      :[r.record_id];
    return `<div class="item${sel} ${dec?tone(dec):""}" data-i="${i}">
      <div class="l1"><span class="rid">${esc(parts[0])}</span>
        <span>${esc(parts.slice(1).join(" · "))}</span>
        <span style="flex:1"></span>${pills}</div>
      <div class="l2">${esc(dotted(r.merged,schema().headline_key)||"")}</div></div>`;
  }).join("")||'<div style="padding:14px;color:var(--faint)">no records match the filter</div>';
  [...document.querySelectorAll(".item")].forEach(el=>{
    el.onclick=()=>{select(parseInt(el.dataset.i,10));};
  });
  const s=document.querySelector(".item.sel"); if(s)s.scrollIntoView({block:"nearest"});
}

function fieldsBySlot(slot){return schema().fields.filter(f=>f.slot===slot);}

function renderSpan(f,m){
  const before=f.config&&f.config.before?dotted(m,f.config.before):"";
  const after=f.config&&f.config.after?dotted(m,f.config.after):"";
  return `<div class="spanview"><span class="ctx">${esc(before||"")}</span>`+
    `<mark>${esc(dotted(m,f.key)||"")}</mark>`+
    `<span class="ctx">${esc(after||"")}</span></div>`;
}

function renderRows(f,val){
  if(!Array.isArray(val)||!val.length)return '<div class="body" style="color:var(--faint)">none</div>';
  const cols=(f.config&&f.config.columns)||[...new Set(val.flatMap(o=>Object.keys(o||{})))];
  return '<div class="tblwrap"><table class="tbl"><thead><tr>'+
    cols.map(c=>`<th>${esc(c)}</th>`).join("")+"</tr></thead><tbody>"+
    val.map(row=>"<tr>"+cols.map(c=>{
      const v=dotted(row||{},c);
      return `<td>${esc(Array.isArray(v)?v.join(", "):(v==null?"":v))}</td>`;
    }).join("")+"</tr>").join("")+"</tbody></table></div>";
}

function renderKv(val){
  if(!val||typeof val!=="object")return '<div class="body">—</div>';
  return '<div class="chips">'+Object.keys(val).map(k=>
    `<span class="chip"><span style="color:var(--faint)">${esc(k)}</span> ${esc(
      Array.isArray(val[k])?val[k].join(", "):String(val[k]))}</span>`).join("")+"</div>";
}

function sidecar(name){
  const s=S.state&&S.state.sidecars?S.state.sidecars[name]:null;
  return s&&typeof s==="object"?s:{};
}

function pairCard(p){
  const kind=p.kind||"pair";
  const byStatus=String(p.left&&p.left.gold_status)!==String(p.right&&p.right.gold_status);
  const byCategory=String(p.left&&p.left.category)!==String(p.right&&p.right.category);
  const contrast=byStatus
    ?"contrast: one side is annotated, the other has this category ruled absent"
    :(byCategory?"contrast: two different gold categories":"contrast: same category and status");
  const side=(s,cls)=>{
    if(!s)return `<div class="side ${cls}">—</div>`;
    const absent=String(s.gold_status)==="absent";
    const labelCls=absent?"absent":(byCategory?"differs":"");
    const status=absent?"gold: category marked ABSENT in this contract":"gold: annotated span";
    const meta=[esc(s.contract_id||"?"),
      s.span_index==null?"":`span #${esc(s.span_index)}`,
      (s.start==null&&s.end==null)?"":`chars ${esc(s.start)}–${esc(s.end)}`].filter(Boolean).join(" · ");
    const text=s.text==null?"":String(s.text);
    const matched=s.match_text==null?"":String(s.match_text);
    const expanded=s.context_expanded&&matched&&matched!==text;
    return `<div class="side ${cls}">
      <span class="side-label ${labelCls}">${esc(s.category||"—")}</span>
      <div class="side-meta">${esc(status)}<br>${meta}</div>
      <div class="side-text">${esc(text||"(no span text — category is absent here)")}</div>`+
      (expanded?'<div class="side-ctx">matched window — the span was short, so the '+
        'miner compared it with surrounding text: '+esc(matched)+"</div>":"")+"</div>";
  };
  return `<div class="pair">
    <div class="pair-head">
      <span class="pid">${esc(p.pair_id||"pair")}</span>
      <span>${esc(kind)}</span>
      <span>similarity ${esc(p.similarity==null?"—":Number(p.similarity).toFixed(3))}</span>
      <span>${p.same_contract?"same contract":"different contracts"}</span>
      <span style="flex:1"></span>
      <span class="contrast">${esc(contrast)}</span>
    </div>
    <div class="pair-body">${side(p.left,"left")}<div class="vs">vs</div>${side(p.right,"right")}</div>
  </div>`;
}

function renderEvidence(f,val){
  const idx=sidecar((f.config&&f.config.index)||"pairs");
  const items=Array.isArray(val)?val:(val==null||val===""?[]:[val]);
  if(!items.length)return '<div class="body" style="color:var(--faint)">none</div>';
  return '<div class="ev">'+items.map(it=>{
    if(it&&typeof it==="object"&&(it.left||it.right))return pairCard(it);
    const key=String(it);
    if(idx[key])return pairCard(Object.assign({pair_id:key},idx[key]));
    if(/^pair[-_]?\d+/i.test(key))
      return `<div class="ev-cite missing">${esc(key)} — not in the pairs index`+
        `${S.state.sidecar_paths&&S.state.sidecar_paths.pairs?" ("+esc(S.state.sidecar_paths.pairs)+")":" (none loaded)"}</div>`;
    return `<div class="ev-cite">${esc(key)}</div>`;
  }).join("")+"</div>";
}

function pct(x){return (100*Number(x)).toFixed(1)+"%";}
function num(x){return Number(x).toLocaleString();}

function fpRate(block){
  if(!block||typeof block!=="object")return null;
  if(block.rate!=null)return Number(block.rate);
  if(block.n_applicable!=null&&block.n_units)return Number(block.n_applicable)/Number(block.n_units);
  return null;
}

function renderDistribution(d){
  if(!d||typeof d!=="object")return "";
  const rows=Array.isArray(d.rows)?d.rows:[];
  let html="";
  if(rows.length){
    const vals=rows.map(r=>{
      const rate=fpRate(r);
      return {key:r.key==null?"—":String(r.key),rate:rate,
        n:r.n_applicable==null?null:Number(r.n_applicable),
        of:r.n_units==null?null:Number(r.n_units)};
    });
    const max=Math.max(...vals.map(v=>v.rate==null?0:v.rate),0.0001);
    html+=`<div class="fp-sec"><h4>distribution${d.by?" by "+esc(d.by):""}</h4><div class="dist">`+
      vals.sort((a,b)=>(b.rate||0)-(a.rate||0)).map(v=>{
        const w=v.rate==null?0:100*v.rate/max;
        const right=[v.rate==null?"":pct(v.rate),
          (v.n==null?"":(v.of==null?num(v.n):num(v.n)+"/"+num(v.of)))].filter(Boolean).join(" · ");
        return `<div class="row"><div class="key" title="${esc(v.key)}">${esc(v.key)}</div>
          <div class="track"><div class="fill" style="width:${w.toFixed(1)}%"></div></div>
          <div class="val">${esc(right)}</div></div>`;
      }).join("")+"</div></div>";
  }
  const c=d.concentration;
  if(c&&typeof c==="object"){
    const chips=Object.keys(c).map(k=>
      `<span class="chip"><span style="color:var(--faint)">${esc(k)}</span> ${esc(c[k])}</span>`).join("");
    html+=`<div class="fp-sec"><h4>concentration</h4><div class="chips">${chips}</div></div>`;
  }
  return html;
}

function statusTone(status){
  const s=String(status).toLowerCase();
  if(/unimplement|error|infeasible/.test(s))return "t-bad";
  if(/degenerate|tautolog|fail/.test(s))return "t-warn";
  if(/discriminat/.test(s))return "t-ok";
  return "t-neutral";
}

function renderFootprint(f,val,r){
  const idxName=(f.config&&f.config.index)||"footprint";
  const doc=sidecar(idxName);
  const table=(doc&&doc.principles&&typeof doc.principles==="object")?doc.principles:{};
  const fp=(val&&typeof val==="object")?val:table[r.record_id];
  const helpId="help-"+idxName;
  const helpBtn=f.help?`<button class="helpbtn" data-help="${helpId}">what is this?</button>`:"";
  const helpBox=f.help?`<div class="helptext" id="${helpId}">${esc(f.help)}</div>`:"";
  if(!fp||typeof fp!=="object"){
    const path=S.state.sidecar_paths?S.state.sidecar_paths.footprint:null;
    return '<div class="fp empty"><div class="fp-head"><h3>empirical footprint</h3>'+
      helpBtn+"</div>"+helpBox+
      '<div class="fp-note">none measured for <b>'+esc(r.record_id)+
      "</b> yet — this record is being judged on the proposer's argument alone. "+
      (path?"footprint file: "+esc(path):"no footprint file loaded (--footprint)")+
      "</div></div>";
  }
  const status=String(fp.status||"ok");
  const prov=[doc.split?"split: "+doc.split:"",
    doc.population&&doc.population.n_units!=null
      ?num(doc.population.n_units)+" "+(doc.population.unit||"units"):"",
    doc.population&&doc.population.n_contracts!=null?num(doc.population.n_contracts)+" contracts":"",
    doc.generated?"generated "+doc.generated:""].filter(Boolean).join(" · ");
  const stats=[];
  const ap=fp.applicability, rate=fpRate(ap);
  if(rate!=null){
    const flag=rate<=0.02||rate>=0.98;
    stats.push(`<div class="stat${flag?" flag":""}"><div class="num">${esc(pct(rate))}</div>
      <div class="lbl">applicability</div><div class="sub">${
        ap.n_applicable!=null?esc(num(ap.n_applicable)+(ap.n_units!=null?" of "+num(ap.n_units):"")):""}${
        flag?"<br>fires on almost "+(rate<=0.02?"nothing":"everything"):""}</div></div>`);
  }
  const di=fp.discrimination;
  if(di&&typeof di==="object"){
    const p=di.pass_rate_positive, n=di.pass_rate_negative;
    let lift=di.lift;
    if(lift==null&&p!=null&&n!=null)lift=Number(p)-Number(n);
    const sub=[p!=null?"gold "+pct(p):"",n!=null?"non-gold "+pct(n):"",
      di.n_positive!=null?"n+ "+num(di.n_positive):"",
      di.n_negative!=null?"n− "+num(di.n_negative):""].filter(Boolean).join(" · ");
    const flag=lift!=null&&Math.abs(Number(lift))<0.05;
    stats.push(`<div class="stat${flag?" flag":""}"><div class="num">${
      lift==null?"—":esc((Number(lift)>=0?"+":"")+Number(lift).toFixed(2))}</div>
      <div class="lbl">discrimination</div><div class="sub">${esc(di.metric||"")}${
        di.metric?"<br>":""}${sub}${flag?"<br>separates nothing":""}</div></div>`);
  }
  const conc=fp.distribution&&fp.distribution.concentration;
  if(conc&&conc.n_contracts_with_any!=null){
    stats.push(`<div class="stat"><div class="num">${esc(num(conc.n_contracts_with_any))}${
      conc.n_contracts!=null?"<span style=\"font-size:14px;color:var(--faint)\">/"+esc(num(conc.n_contracts))+"</span>":""}</div>
      <div class="lbl">contracts touched</div><div class="sub">${
        conc.median_per_contract!=null?"median "+esc(conc.median_per_contract)+" per contract":""}</div></div>`);
  }
  const known=new Set(["status","note","applicability","distribution","discrimination","examples"]);
  const extra=Object.keys(fp).filter(k=>!known.has(k));
  return `<div class="fp"><div class="fp-head"><h3>empirical footprint</h3>
    ${status!=="ok"?`<span class="pill ${statusTone(status)}">${esc(status)}</span>`:""}
    <span class="prov">${esc(prov)}</span><span style="flex:1"></span>${helpBtn}</div>${helpBox}`+
    (stats.length?`<div class="fp-stats">${stats.join("")}</div>`
      :`<div class="fp-note">footprint present but carries no measurements.</div>`)+
    renderDistribution(fp.distribution)+
    (Array.isArray(fp.examples)&&fp.examples.length
      ? `<div class="fp-sec"><h4>examples</h4>`+
        renderRows({config:{columns:[...new Set(fp.examples.flatMap(o=>Object.keys(o||{})))]}},fp.examples)+
        "</div>" : "")+
    (fp.note?`<div class="fp-note">${esc(fp.note)}</div>`:"")+
    (extra.length?`<div class="fp-sec"><h4>further measurements</h4>`+
      extra.map(k=>`<details class="fp-more"><summary>${esc(k)}</summary><div class="body">${
        esc(JSON.stringify(fp[k],null,1))}</div></details>`).join("")+"</div>":"")+
    "</div>";
}

function sidecarDoc(name){
  const doc=sidecar(name);
  return {header:(doc&&doc.header&&typeof doc.header==="object")?doc.header:{},
    records:(doc&&doc.records&&typeof doc.records==="object")?doc.records:{}};
}

function helpFor(f,id){
  return {btn:f.help?`<button class="helpbtn" data-help="${id}">what is this?</button>`:"",
    box:f.help?`<div class="helptext" id="${id}">${esc(f.help)}</div>`:""};
}

function missingBlock(cls,title,rid,pathKey,flag,help){
  const path=S.state.sidecar_paths?S.state.sidecar_paths[pathKey]:null;
  const msg="nothing recorded for <b>"+esc(rid)+"</b>. Every other record in this round carries "+
    "this block, so treat it as a gap in the evidence, not as a neutral or negative finding. "+
    (path?"file searched: "+esc(path):"no file loaded ("+esc(flag)+")");
  return `<div class="${cls} empty"><div class="fp-head"><h3>${esc(title)}</h3>`+
    `<span class="pill t-bad">no entry</span><span style="flex:1"></span>${help.btn}</div>`+
    `${help.box}<div class="fp-note">${msg}</div></div>`;
}

function blk(label,text,cls,lead){
  if(text==null||String(text).trim()==="")return "";
  return `<div class="blk ${cls||""}"><h4>${esc(label)}</h4>`+
    (lead?`<div class="lead">${esc(lead)}</div>`:"")+
    `<div class="t">${esc(String(text).trim())}</div></div>`;
}

function extraDetails(obj,known){
  const extra=Object.keys(obj).filter(k=>!known.has(k));
  if(!extra.length)return "";
  return `<div class="blk"><h4>further fields</h4>`+
    extra.map(k=>`<details class="fp-more"><summary>${esc(k)}</summary><div class="body">${
      esc(JSON.stringify(obj[k],null,1))}</div></details>`).join("")+"</div>";
}

const XS_STATUS={
  corroborated:{tone:"t-ok",gloss:"the other source independently agrees with this claim"},
  contradicted:{tone:"t-bad",gloss:"the other source states something different"},
  silent:{tone:"t-neutral",
    gloss:"the other source says nothing about this claim — neutral, not disagreement"}
};
const XS_DIRECTION={
  guidelines_to_data:"guidelines → data · a Handbook-derived claim checked against CUAD gold",
  data_to_guidelines:"data → guidelines · a mined claim checked against the Atticus Handbook"
};

function renderCrossSource(f,val,r){
  const idxName=(f.config&&f.config.index)||"cross_source";
  const doc=sidecarDoc(idxName);
  const xs=(val&&typeof val==="object")?val:doc.records[r.record_id];
  const help=helpFor(f,"help-"+idxName);
  if(!xs||typeof xs!=="object")
    return missingBlock("xs","cross-source validation",r.record_id,idxName,"--cross-source",help);
  const status=String(xs.status||"unstated").toLowerCase();
  const spec=XS_STATUS[status]||{tone:"t-neutral",gloss:""};
  const dir=xs.direction?String(xs.direction):"";
  const dirText=XS_DIRECTION[dir]||dir.replace(/_to_/," → ").replace(/_/g," ");
  const silent=status==="silent";
  const head=`<div class="fp-head"><h3>cross-source validation</h3>
    <span class="pill ${spec.tone}" title="${esc(spec.gloss)}">${esc(status)}</span>
    ${xs.confidence?`<span class="pill t-neutral">confidence ${esc(xs.confidence)}</span>`:""}
    <span class="prov">${esc(dirText)}</span><span style="flex:1"></span>${help.btn}</div>${help.box}`;
  const verdict=`<div class="fp-note">${esc(spec.gloss||"status: "+status)}.${
    silent?" A silent record is neither supported nor undermined by this check — it is exactly"+
      " as unvalidated as it was before, and the reason is below.":""}</div>`;
  const silence=silent
    ? blk("why the other source is silent",
        xs.silence_reason||"no reason recorded — the silence is unexplained, which is itself"+
        " worth weighing.","silence",
        "Silence is usually structural: the second source has no section that could speak to"+
        " this claim. It is not evidence against the principle.")
    : blk("silence reason",xs.silence_reason,"silence");
  const known=new Set(["direction","status","claim_tested","evidence","quantification",
    "confidence","note","silence_reason"]);
  return `<div class="xs st-${esc(status)}">`+head+verdict+silence+
    blk("claim tested",xs.claim_tested,"claim")+
    blk("evidence",xs.evidence)+
    blk("quantification",xs.quantification,"quant")+
    blk("note",xs.note)+
    extraDetails(xs,known)+"</div>";
}

const CRIT_CONF={
  strong:{tone:"t-bad",gloss:"the objection lands; do not ship as written"},
  moderate:{tone:"t-warn",gloss:"the objection lands but is survivable with a rewrite"},
  weak:{tone:"t-neutral",gloss:"the objection is real but small"},
  could_not_break:{tone:"t-ok",gloss:"the critic attacked it and failed"}
};
const CRIT_REC={drop:"t-bad",keep:"t-ok"};

function confPill(value,vocab,prefix){
  if(value==null||value==="")return "";
  const key=String(value).toLowerCase();
  const spec=CRIT_CONF[key]||{tone:"t-neutral",gloss:""};
  const gloss=(vocab&&vocab[key])?String(vocab[key]).trim():spec.gloss;
  return `<span class="pill ${spec.tone}" title="${esc(gloss)}">${esc(prefix||"")}${
    esc(String(value).replace(/_/g," "))}</span>`;
}

function objectionCard(o,vocab){
  const conf=String(o.confidence||"").toLowerCase();
  const cx=Array.isArray(o.counterexamples)?o.counterexamples.filter(x=>x&&typeof x==="object"):[];
  return `<div class="obj c-${esc(conf||"none")}">
    <div class="obj-head"><span class="axis">${esc(String(o.axis||"objection").replace(/_/g," "))}</span>
      <span style="flex:1"></span>${confPill(o.confidence,vocab,"")}</div>
    <div class="claim">${esc(String(o.claim==null?"—":o.claim).trim())}</div>`+
    (o.quantification!=null&&String(o.quantification).trim()!==""
      ?`<div class="q">${esc(String(o.quantification).trim())}</div>`:"")+
    (cx.length?`<div class="cx"><h5>counterexamples (${cx.length})</h5>`+
      renderRows({config:{columns:[...new Set(cx.flatMap(x=>Object.keys(x)))]}},cx)+"</div>":"")+
    "</div>";
}

function renderCritique(f,val,r){
  const idxName=(f.config&&f.config.index)||"critiques";
  const doc=sidecarDoc(idxName);
  const c=(val&&typeof val==="object")?val:doc.records[r.record_id];
  const help=helpFor(f,"help-"+idxName);
  if(!c||typeof c!=="object")
    return missingBlock("cr","adversarial critique",r.record_id,idxName,"--critiques",help);
  const meta=doc.header.meta&&typeof doc.header.meta==="object"?doc.header.meta:doc.header;
  const vocab=(meta&&meta.confidence_vocabulary&&typeof meta.confidence_vocabulary==="object")
    ?meta.confidence_vocabulary:{};
  const rec=c.recommendation?String(c.recommendation):"";
  const recTone=CRIT_REC[rec]||"t-warn";
  const objs=Array.isArray(c.objections)?c.objections.filter(o=>o&&typeof o==="object"):[];
  const head=`<div class="fp-head"><h3>adversarial critique</h3>
    ${confPill(c.confidence,vocab,"")}
    ${rec?`<span class="pill ${recTone}">${esc(rec.replace(/_/g," "))}</span>`:""}
    <span class="prov">${esc(meta&&meta.role?String(meta.role).trim():"")}</span>
    <span style="flex:1"></span>${help.btn}</div>${help.box}`;
  const attack=`<div class="col att"><h4>objections (${objs.length})</h4>
    <div class="lead">Commissioned, not spontaneous: the critic was instructed to argue against
    every candidate, so every record has some. Weigh the per-objection confidence, not the
    count.</div>`+
    (objs.length?objs.map(o=>objectionCard(o,vocab)).join("")
      :'<div class="def-text" style="color:var(--dim)">no objection recorded.</div>')+"</div>";
  const defence=`<div class="col def"><h4>strongest defence</h4>
    <div class="lead">Written by the same critic, after the attack: the best case still standing
    for this candidate. It carries the same weight as the column beside it.</div>`+
    (c.strongest_defence&&String(c.strongest_defence).trim()
      ?`<div class="def-text">${esc(String(c.strongest_defence).trim())}</div>`
      :'<div class="def-text" style="color:var(--dim)">the critic recorded no defence for this '+
       'candidate — that absence is itself a finding, not an omission by the tool.</div>')+"</div>";
  const known=new Set(["verdict","confidence","recommendation","objections","strongest_defence"]);
  return `<div class="cr">`+head+
    blk("verdict",c.verdict,"claim")+
    `<div class="cr-cols">${attack}${defence}</div>`+
    extraDetails(c,known)+"</div>";
}

function renderValue(f,val,m,r){
  if(f.kind==="span")return renderSpan(f,m);
  if(f.kind==="cross_source")return renderCrossSource(f,val,r);
  if(f.kind==="critique")return renderCritique(f,val,r);
  if(f.kind==="footprint")return renderFootprint(f,val,r);
  if(f.kind==="evidence")return renderEvidence(f,val);
  if(f.kind==="rows")return renderRows(f,val);
  if(f.kind==="kv")return renderKv(val);
  if(Array.isArray(val))
    return '<div class="chips">'+(val.length?val.map(x=>`<span class="chip">${esc(x)}</span>`).join(""):'<span class="chip">none</span>')+"</div>";
  return `<div class="body">${esc(val==null||val===""?"—":val)}</div>`;
}

function renderRecord(){
  const r=current();
  if(!r){$("record").innerHTML='<div style="color:var(--faint)">nothing selected</div>';
    $("decisions").innerHTML="";return;}
  const v=visible(), idx=v.indexOf(r);
  const m=r.merged, src=r.source;
  const editedKeys=Object.keys(r.edits||{});
  const stmtKey=schema().headline_key;
  let html=`<div class="rec-head"><div class="rid">${esc(r.record_id)}</div>
    <div class="pos">${idx+1} of ${v.length} shown · #${r.ordinal+1} in file</div></div>`;
  const flat=(v)=>Array.isArray(v)?(v.length?v.join(", "):"— none"):(v==null||v===""?"—":v);
  const was=(k)=>editedKeys.includes(k)
    ? `<div class="was"><b>model said:</b> ${esc(flat(dotted(src,k)))}</div>` : "";
  const headField=schema().fields.find(f=>f.slot==="headline")||{key:stmtKey,kind:"longtext"};
  html+=`<div class="statement${editedKeys.includes(stmtKey)?" edited":""}">`+
    (headField.kind==="span"?renderSpan(headField,m):esc(flat(dotted(m,stmtKey))))+"</div>";
  html+=was(stmtKey);
  html+='<div class="meta">'+fieldsBySlot("meta").map(f=>{
    const ed=editedKeys.includes(f.key);
    return `<div class="kv${ed?" edited":""}"><span>${esc(f.label)}</span> ${esc(flat(dotted(m,f.key)))}`+
      (ed?` <span class="wasin">was ${esc(flat(dotted(src,f.key)))}</span>`:"")+"</div>";
  }).join("")+"</div>";
  html+=fieldsBySlot("feature").map(f=>renderValue(f,dotted(m,f.key),m,r)).join("");
  const cards=fieldsBySlot("body").map(f=>{
    const val=dotted(m,f.key);
    const ed=editedKeys.includes(f.key)?" edited":"";
    const wide=(f.kind==="rows"||f.kind==="span"||f.kind==="evidence")?" wide":"";
    const hid="help-"+f.key.replace(/[^a-z0-9]/gi,"_");
    const helpBtn=f.help?`<button class="helpbtn" data-help="${hid}">what is this?</button>`:"";
    const helpBox=f.help?`<div class="helptext" id="${hid}">${esc(f.help)}</div>`:"";
    return `<div class="card${ed}${wide}"><h3>${esc(f.label)}${helpBtn}</h3>${helpBox}`+
      `${renderValue(f,val,m,r)}${was(f.key)}`+
      (f.hint?`<div class="hint">${esc(f.hint)}</div>`:"")+"</div>";
  });
  html+='<div class="grid">'+cards.join("")+"</div>";
  const consumed=new Set([schema().review_key,schema().id_key]);
  schema().fields.forEach(f=>{
    consumed.add(f.key.split(".")[0]);
    Object.values(f.config||{}).forEach(v=>{if(typeof v==="string")consumed.add(v);});
  });
  const unknown=Object.keys(src).filter(k=>!consumed.has(k));
  if(unknown.length)
    html+=`<div class="card" style="margin-top:10px"><h3>other fields (preserved on export)</h3>
      <div class="body">${esc(JSON.stringify(Object.fromEntries(unknown.map(k=>[k,src[k]])),null,1))}</div></div>`;
  if(r.review){
    const ef=r.review.edited_from;
    const efLine=ef?`\nedited_from: ${Object.keys(ef).join(", ")}`:"";
    html+=`<div class="card" style="margin-top:10px"><h3>current review</h3><div class="body">`+
      `<span class="pill ${tone(r.review.decision)}">${esc(r.review.decision)}</span> `+
      `${esc(r.review.reviewer)} · ${esc(r.review.date)}\n${esc(r.review.rationale)}`+
      `${esc(efLine)}</div></div>`;
  }
  $("record").innerHTML=html;
  bindHelp();
  $("record").scrollTop=0;
  renderDecisions();
  renderEditor();
  $("stamp").textContent=`${S.state.reviewer} · ${new Date().toISOString().slice(0,10)}`;
  validate();
}

function openHelp(){
  try{return new Set(JSON.parse(localStorage.getItem("openHelp")||"[]"));}
  catch(e){return new Set();}
}
function bindHelp(){
  const open=openHelp();
  [...document.querySelectorAll(".helpbtn")].forEach(b=>{
    const box=$(b.dataset.help);
    const on=open.has(b.dataset.help);
    if(box)box.className="helptext"+(on?" on":"");
    b.className="helpbtn"+(on?" on":"");
    b.onclick=()=>{
      const set=openHelp();
      if(set.has(b.dataset.help))set.delete(b.dataset.help); else set.add(b.dataset.help);
      localStorage.setItem("openHelp",JSON.stringify([...set]));
      bindHelp();
    };
  });
}

function decisionSpec(name){return schema().decisions.find(d=>d.name===name)||null;}
function tone(name){const d=decisionSpec(name);return d?"t-"+d.tone:"t-neutral";}

function rationaleFirst(){return $("rationaleFirst").checked;}
function decisionsLocked(){
  return rationaleFirst()&&$("rationale").value.trim().length===0;
}

function renderDecisions(){
  const locked=decisionsLocked();
  $("decisions").innerHTML=schema().decisions.map(d=>
    `<button class="dbtn ${tone(d.name)}${S.decision===d.name?" on":""}" data-d="${esc(d.name)}"`+
    (locked?" disabled":"")+
    (d.hint?` title="${esc(d.name)} — ${esc(d.hint)}"`:` title="${esc(d.name)}"`)+
    `>${esc(d.name)}<span class="k">${esc(d.hotkey)}</span></button>`
  ).join("");
  [...document.querySelectorAll(".dbtn")].forEach(b=>b.onclick=()=>setDecision(b.dataset.d));
}

function renderKeyHelp(){
  $("dkeys").innerHTML=schema().decisions.map(d=>
    `<kbd>${esc(d.hotkey)}</kbd> ${esc(d.name)}`).join(" &nbsp; ")+"<br>";
}

function renderEditor(){
  const box=$("editor");
  if(!schema().edit_decision||S.decision!==schema().edit_decision){
    box.className="";box.innerHTML="";return;}
  const r=current();
  box.className="on";
  box.innerHTML=schema().fields.filter(f=>f.editable).map(f=>{
    const val=S.edits[f.key]!==undefined?S.edits[f.key]:dotted(r.merged,f.key);
    const shown=Array.isArray(val)?val.join(", "):(val==null?"":val);
    const tag=f.kind==="longtext"?`<textarea rows="3" data-k="${f.key}">${esc(shown)}</textarea>`
      :`<input data-k="${f.key}" value="${esc(shown)}">`;
    return `<label>${esc(f.label)}${f.kind==="list"?" (comma separated)":""}</label>${tag}`;
  }).join("");
  [...box.querySelectorAll("[data-k]")].forEach(el=>{
    el.oninput=()=>{
      const f=schema().fields.find(x=>x.key===el.dataset.k);
      S.edits[f.key]=f.kind==="list"
        ? el.value.split(",").map(s=>s.trim()).filter(Boolean)
        : el.value;
      S.dirty=true; queueDraft(); validate();
    };
  });
}

function setDecision(d){
  if(decisionsLocked())return;
  S.decision=(S.decision===d)?null:d;
  const ek=schema().edit_decision;
  if(ek&&S.decision===ek&&Object.keys(S.edits).length===0){
    const r=current();
    schema().fields.filter(f=>f.editable).forEach(f=>{S.edits[f.key]=dotted(r.merged,f.key);});
  }
  if(S.decision!==ek)S.edits={};
  renderDecisions(); renderEditor(); queueDraft(); validate();
  if(S.decision)$("rationale").focus();
}

function validate(){
  const has=$("rationale").value.trim().length>0;
  const editChanged=S.decision!==schema().edit_decision||changedEdits().length>0;
  const ok=!!S.decision&&has&&editChanged;
  $("saveBtn").disabled=!ok;
  let msg="";
  if(decisionsLocked())msg="rationale first — write why, then pick a decision";
  else if(!S.decision)msg="pick a decision";
  else if(!has)msg='<span class="warn">rationale required — a bare accept tells the writeup nothing</span>';
  else if(!editChanged)msg='<span class="warn">edit selected but nothing changed</span>';
  else msg="ready — ctrl+enter";
  $("reqmsg").innerHTML=msg;
}

function changedEdits(){
  const r=current(); if(!r)return [];
  return Object.keys(S.edits).filter(k=>
    JSON.stringify(S.edits[k])!==JSON.stringify(dotted(r.source,k)));
}

let draftTimer=null;
function queueDraft(){
  clearTimeout(draftTimer);
  draftTimer=setTimeout(async()=>{
    const r=current(); if(!r)return;
    await fetch("/api/draft",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({record_id:r.record_id,decision:S.decision,
        rationale:$("rationale").value,edits:S.edits})});
  },400);
}

function loadInto(r){
  S.decision=r.review?r.review.decision:(r.draft?r.draft.decision:null);
  S.edits=r.review?Object.assign({},r.edits):(r.draft?Object.assign({},r.draft.edits||{}):{});
  $("rationale").value=r.review?r.review.rationale:(r.draft?r.draft.rationale||"":"");
  S.dirty=false;
}

function select(i){
  const v=visible(); if(!v.length)return;
  S.sel=Math.max(0,Math.min(i,v.length-1));
  loadInto(v[S.sel]);
  renderList(); renderRecord();
}

async function refresh(keepId){
  const res=await fetch("/api/state");
  S.state=await res.json();
  $("src").textContent=S.state.source;
  if(!$("fFacet0").dataset.built){buildFacets();buildDecisionFilter();renderKeyHelp();reportSync();}
  renderProgress();
  const v=visible();
  if(keepId){const i=v.findIndex(r=>r.record_id===keepId); if(i>=0)S.sel=i;}
  select(S.sel);
}

function buildFacets(){
  schema().facets.forEach((f,i)=>{
    const el=$("fFacet"+i); if(!el)return;
    const vals=[...new Set(records().map(r=>dotted(r.merged,f.key)).filter(x=>x!=null&&x!==""))].sort();
    el.innerHTML=`<option value="">all ${esc(f.label.toLowerCase())}</option>`+
      vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
    el.onchange=()=>{S.sel=0;renderList();renderRecord();};
    el.dataset.built="1";
  });
  for(let i=schema().facets.length;i<3;i++){const el=$("fFacet"+i); if(el)el.style.display="none";}
}

async function save(){
  const r=current(); if(!r||$("saveBtn").disabled)return;
  const body={record_id:r.record_id,decision:S.decision,
    rationale:$("rationale").value.trim(),edits:S.edits};
  const res=await fetch("/api/review",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok){const e=await res.json();toast("not saved: "+(e.detail||res.status),true);return;}
  toast(`${r.record_id} → ${S.decision}`);
  const id=r.record_id;
  await refresh(id);
  nextUnreviewed();
}

function nextUnreviewed(){
  const v=visible();
  for(let k=1;k<=v.length;k++){
    const i=(S.sel+k)%v.length;
    if(!v[i].review){select(i);return;}
  }
  select(Math.min(S.sel+1,v.length-1));
}

async function doExport(force){
  const res=await fetch("/api/export",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(force?{force:true}:{})});
  if(res.status===409){
    const e=await res.json();
    if(window.confirm(e.detail+"\n\nOverwrite it anyway?"))return doExport(true);
    toast("export cancelled — nothing was written",true);
    return;
  }
  if(!res.ok){const e=await res.json();toast("not exported: "+(e.detail||res.status),true);return;}
  const j=await res.json();
  toast(`exported ${j.n} records\n${j.path}`);
}

function reportSync(){
  const s=S.state.last_sync||{};
  const adopted=(s.adopted_from_file||[]).length;
  const clashes=s.conflicts||[];
  if(clashes.length)
    toast(`${clashes.length} record(s) disagree with the file; kept the store's `+
      `decision:\n`+clashes.map(c=>
        `${c.record_id}: kept ${c.kept_from_db}, ignored ${c.ignored_from_file}`
      ).join("\n"),true);
  else if(adopted)
    toast(`restored ${adopted} decision(s) from the source file`);
}

document.addEventListener("keydown",(ev)=>{
  if(!S.state)return;
  const inField=/^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement.tagName);
  if((ev.ctrlKey||ev.metaKey)&&ev.key==="Enter"){ev.preventDefault();save();return;}
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==="e"){ev.preventDefault();doExport(false);return;}
  if(ev.key==="Escape"){document.activeElement.blur();return;}
  if(inField)return;
  const nav={j:()=>select(S.sel+1),k:()=>select(S.sel-1),u:nextUnreviewed,
    i:()=>$("rationale").focus(),"/":()=>$("fText").focus()};
  const clash=schema().decisions.filter(d=>d.hotkey in nav).map(d=>d.name);
  if(clash.length)console.warn("decision hotkey clashes with navigation:",clash);
  schema().decisions.forEach(d=>{if(d.hotkey&&!(d.hotkey in nav))nav[d.hotkey]=()=>setDecision(d.name);});
  const fn=nav[ev.key];
  if(fn){ev.preventDefault();fn();}
});
$("rationale").addEventListener("input",()=>{
  S.dirty=true;queueDraft();
  if(rationaleFirst())renderDecisions();
  validate();
});
$("rationaleFirst").checked=localStorage.getItem("rationaleFirst")==="1";
$("rationaleFirst").onchange=()=>{
  localStorage.setItem("rationaleFirst",$("rationaleFirst").checked?"1":"0");
  renderDecisions(); validate();
};
$("saveBtn").onclick=save;
$("exportBtn").onclick=()=>doExport(false);
$("fDecision").onchange=()=>{S.sel=0;renderList();renderRecord();};
$("fText").oninput=()=>{S.sel=0;renderList();renderRecord();};
window.addEventListener("beforeunload",()=>{
  const r=current();
  if(r&&S.dirty)navigator.sendBeacon("/api/draft",new Blob([JSON.stringify(
    {record_id:r.record_id,decision:S.decision,rationale:$("rationale").value,edits:S.edits})],
    {type:"application/json"}));
});
refresh();
</script>
</body>
