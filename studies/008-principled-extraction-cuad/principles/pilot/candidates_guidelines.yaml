- id: g02
  statement: When the responsive material is not contiguous in the contract — a lead-in plus one of several
    subsections, a clause plus the definition it needs, or two clauses that must be read together — the
    span concatenates only the responsive fragments, in document order, separated by the marker "<omitted>",
    and drops the intervening non-responsive text.
  trigger_guidance: Consider whenever the responsive text sits inside an enumerated list, or depends on
    a defined term or on a date stated elsewhere in the contract.
  type: procedure
  scope: []
  provenance: atticus_guidelines
  evidence:
  - Handbook ch.1, subsection rule (p.5) — worked example labels 14.2 and 14.2.10 with the marker between
    them, dropping 14.2.1-14.2.9
  - Handbook ch.1, definitions rule (p.6) — a needed definition is appended after the marker; self-evident
    defined terms are not labelled
  - CUAD Datasheet II-F — same convention, described as manual deletion of the non-responsive portion
    (CC BY 4.0, quotable)
  checker_sketch: 'Applicability: the gold span set for this decision contains at least one span containing
    the literal marker "<omitted>". Compliance: the predicted span set for that decision contains at least
    one span with the marker, AND no predicted span is a contiguous substring of the contract that spans
    both fragments (which would be the "just take the whole block" failure). Both halves are pure string
    work over data we already hold. Cheap and unambiguous. Caveat: the marker must appear in the prompt''s
    task definition or no model will ever emit it, which makes this principle a partial test of instruction-following
    rather than of legal judgement.'
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
