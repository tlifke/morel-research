- id: p01
  statement: A clause must show on its own that a revenue or profit share exists to be responsive;
    machinery that merely administers one — reporting obligations, report timing, objection
    and audit process, dispute resolution — is not Revenue/Profit Sharing.
  trigger_guidance: Consider when a candidate sentence is about a revenue share but describes
    process rather than entitlement, or when the sentence only makes sense given a percentage
    stated elsewhere.
  type: constraint
  scope:
  - Revenue/Profit Sharing
  provenance: atticus_guidelines
  proposer:
    batch_id: null
    harness: claude-code
    invocation: subagent
    model: claude-opus-5
    prompt_version: null
    source_document: CUAD Labeling Handbook (Atticus Project, 2021) + CUAD v1 Datasheet
  evidence:
  - Handbook, Revenue/Profit Sharing, IS-NOT list (p.89) — standalone-basis rule, with administration,
    dispute resolution, reporting obligations, report preparation time and audit/objection
    process listed as non-responsive because they recur in contracts with no revenue share
  - 'Handbook, Revenue/Profit Sharing, IS list (p.88) — the converse: a clause stating that
    one party''s compensation is based on the other''s revenue IS responsive even when the
    percentage lives in a different clause'
  - CUAD Datasheet III-B — the dataset labels only clauses that are responsive on a standalone
    basis (CC BY 4.0, quotable)
  checker_sketch: 'Applicability: the contract contains a sentence matching an administration
    pattern (report | statement of account | within N days of the end of each | audit | object
    | dispute) in the same sentence as a revenue/profit/royalty term — instance only. Compliance:
    no predicted Revenue/Profit Sharing span is such a sentence when it lacks the g05 entitlement
    signals (percentage-of-revenue, per-unit, equity). Programmatic but a proxy; it shares
    g05''s lexical weakness and the two should be audited on the same hand-scored sample.
    Distinct from g05 in the error it catches: g05 catches wrong-arithmetic, g06 catches right-topic-wrong-function,
    and the H4 confusion matrix can tell them apart only if they are separate ids.'
  review:
    decision: accept
    reviewer: tyler
    date: '2026-08-16'
    rationale: My sense is this is correct-ish? I have no idea how I would decide otherwise
      without expertise.
- id: p02
