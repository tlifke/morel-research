- id: d04
  statement: 'A guaranteed floor qualifies for the minimum-commitment target whichever party it binds,
    and whatever it is a floor on — supply, payment or access — not only a buyer''s purchase obligation.

    '
  trigger_guidance: 'Consider whenever a clause states a guaranteed minimum quantity or amount but the
    obligated party is the supplier rather than the buyer, or the thing guaranteed is not a purchase;
    the target''s one-line definition reads narrower than the convention.

    '
  type: constraint
  scope:
  - Minimum Commitment
  provenance: data_mined
  evidence:
  - pair-0008
  - pair-0011
  - pair-0012
  n_supporting_pairs: 3
  checker_sketch: 'Applicable to a Minimum Commitment decision when the contract contains a sentence matching
    /\b(minimum|at least|no less than)\b/ within 200 characters of a quantity token (/\d|\*{3,}|\[\*+\]/)
    AND the subject of the obligation is not the purchasing party — approximated by testing whether the
    sentence matches /\b(supply|deliver|provide|share|allocate| make available)\b/ rather than /\b(buy|purchase|order)\b/.
    Compliance: the decision is an Extraction covering that sentence rather than an AbsenceClaim.

    '
  defect_argument: 'Three spans across two contracts label a floor that runs the wrong way for the literal
    definition: Excite@Home "will supply to e-centives a minimum of ***** records" (pair-0008), the same
    construction for General Program Members (pair-0011), and a payer-side "agrees to share a minimum
    of $50,000.00 annually" (pair-0012). Corroborated outside this batch by pair-0022, where "New Shippers
    will have access to a minimum of ten percent (10%) of the Available Capacity" is Minimum Commitment
    — an access right, not a purchase at all. This is the highest-leverage candidate in the set because
    a reader applying the printed definition literally would return an AbsenceClaim on every one of these
    contracts.

    '
  review:
