- id: d03
  statement: 'An obligation stated purely as a proportion of an outcome answers the sharing target, while
    the same obligation answers the minimum-commitment target once it also guarantees a fixed floor.

    '
  trigger_guidance: 'Consider on any royalty, fee or revenue-share clause: check whether it names a guaranteed
    amount or a "minimum"/"at least" qualifier alongside the percentage.

    '
  type: disambiguation
  scope:
  - Minimum Commitment
  - Revenue/Profit Sharing
  provenance: data_mined
  evidence:
  - pair-0009
  - pair-0010
  - pair-0012
  - pair-0013
  n_supporting_pairs: 4
  checker_sketch: 'For each gold span, compute two booleans over the span text: HAS_SHARE = match of /\d+(\.\d+)?\s*%|percent/
    near /revenue|sales|profit|royalt/, and HAS_FLOOR = match of /\bminimum\b|\bat least\b|\bno less than\b|\bguarantee/
    or a currency literal /\$\s?[\d,]+/ in the same span. Applicable to a Minimum Commitment or Revenue/Profit
    Sharing decision when the contract contains at least one span with HAS_SHARE true. Compliance: spans
    with HAS_FLOOR true appear in the Minimum Commitment decision; spans with HAS_SHARE true and HAS_FLOOR
    false appear in the Revenue/Profit Sharing decision.

    '
  defect_argument: 'Four pairs across three contracts point the same way, and two of them (pair-0012 Pacificap,
    pair-0010 / pair-0013 Virtuoso) are same-contract near-verbatim contrasts where the annotator made
    both calls on adjacent sentences — "agrees to share a minimum of $50,000.00 annually" against "agrees
    to share 10% of the net revenue", and "minimum annual royalties" against "a running royalty ... based
    upon NET SALES". A mislabel does not reproduce itself in that pattern in three unrelated documents.
    Excluded deliberately: pair-0006, where the same amount is annotated under both categories in two
    places in one contract, and pair-0007, where near-identical guarantee language receives two labels
    — those are the weak side of this boundary and support nothing.

    '
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: proposer_v1
    batch_id: cm-002
