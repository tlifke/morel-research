<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Pipeline — App</title>
<style>body{font-family:system-ui,sans-serif;margin:0;display:grid;grid-template-columns:280px 1fr;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/-1;padding:1rem;background:#1a2332;color:#fff}
aside{overflow:auto;padding:1rem;border-right:1px solid #ddd;background:#f6f7f9}
.card{padding:.6rem .8rem;margin:.4rem 0;background:#fff;border:1px solid #ddd;border-radius:6px;cursor:pointer}
.card.active{border-color:#3b82f6;background:#eff6ff}
main{padding:1.5rem;overflow:auto;background:#fff}
.pinned{position:sticky;top:0;background:#fff;border-bottom:2px solid #3b82f6;padding:1rem 0}
</style></head>
<body>
<header><h1>Pipeline — App</h1><div>Reusible web app · JS loads loop data</div></header>
<aside id="steps"></aside>
<main>
<div class="pinned" id="pinned">Loading...</div>
<div id="detail"></div>
</main>
<script>
// App logic: load step data from loop_scripts/intermediate, render cards, update pinned+detail on click.
// Source: loop_scripts/ + test_pipe/intermediate/ — ingested via JS for reusability across contracts.
const steps = [
  {id:1,title:"Manifest",tag:"input",fetch:"intermediate/step1.json"},
  {id:2,title:"Prompt snippet",tag:"intermediate/snippet",fetch:"intermediate/snippet.txt"},
  {id:3,title:"Contract text",tag:"intermediate/contract_text",fetch:"intermediate/contract_text.txt"},
  {id:4,title:"Compare — input",tag:"step2 clauses / target",preview:"Most Favored Nation clause (Advertising/Benefits + Relationship to Other Sponsors)",full:"Most Favored Nation: (i) Advertising and Other Benefits — Sponsor shall receive all benefits customarily associated with sponsorship; (ii) Relationship to Other Sponsors — Sponsor approves additional sponsors unless..."},
  {id:5,title:"Compare — LLM output + decision",tag:"step2 output",fetch:"intermediate/step2_clauses.json"},
  {id:6,title:"Diagnose — input discrepancy",tag:"step2 discrepancy",fetch:"intermediate/step1_discrepancy.json"},
  {id:7,title:"Diagnose — output / reasoning",tag:"step2 reasoning",fetch:"intermediate/step2_clauses.json"},
  {id:8,title:"Derive — principle proposal",tag:"step3 proposal",preview:"Assignment constraint: Neither party assigns rights/obligations without prior written consent (derived-001)",full:"Neither party shall assign any of its rights or obligations under this Agreement without the prior written consent of the other party."},
  {id:9,title:"Derive — reasoning (final)",tag:"step3 final",fetch:"intermediate/step3_principle_fixed.json"},
  {id:10,title:"Test — pre vs post",tag:"step4 final",fetch:"intermediate/step1.json"}
];
function render(){
  document.getElementById('steps').innerHTML = steps.map((s,i)=>`<div class="card ${i===0?'active':''}" onclick="select(${i})"><b>${s.id} ${s.title}</b> · ${s.tag}</div>`).join('');
  select(0);
}
function select(i){
  document.querySelectorAll('.card').forEach((c,j)=>c.classList.toggle('active',j===i));
  const s=steps[i];
  document.getElementById('pinned').innerHTML = `<strong>Step ${s.id} ${s.title}</strong> · source: <code>${s.tag}</code> · <span style="color:#555">${s.preview||''}</span>`;
  if(s.fetch){fetch(s.fetch).then(r=>r.text()).then(t=>{document.getElementById('detail').innerHTML='<h2>'+s.title+'</h2><blockquote style="margin:1rem 0;padding:1rem;background:#f9f9f9;border-left:3px solid #3b82f6;font-family:serif;white-space:pre-wrap">'+t.replace(/</g,'&lt;')+'</blockquote>';document.getElementById('pinned').innerHTML+='<br><em>Full text loaded ('+t.split('\\n').length+' lines)</em>';});} else {document.getElementById('detail').innerHTML='<h2>'+s.title+'</h2><p><strong>Source:</strong><code>'+s.tag+'</code></p><p><em>Loaded from loop_scripts / intermediate.</em>'+ (s.preview?'<br><strong>Snippet:</strong> '+s.preview:'')+'</p>'+ (s.full?'<blockquote style="margin:1rem 0;padding:.5rem;background:#f6f7f9;border-left:3px solid #3b82f6;font-family:serif">'+s.full+'</blockquote>':'');}
}render();
</script>
</body></html>
