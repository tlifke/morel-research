[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["morel_research"]

[project]
name = "morel-research"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "plotly>=5.20",
    "kaleido==0.2.1",
    "pydantic>=2.13.4",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "huggingface-hub>=1.28.0",
]

[project.scripts]
# Minimal pi harness wrapper (scripts/pi-clean). Run via: uv run pi-clean
pi-clean = "morel_research._pi_clean:main"

[dependency-groups]
dev = [
    "anthropic>=0.104.1",
]
