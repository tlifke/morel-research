- id: d02
  statement: 'A passage that independently satisfies more than one target''s definition is extracted under
    each of them; targets are not mutually exclusive.

    '
  trigger_guidance: 'Consider whenever a single clause has already been assigned to one target and would
    also answer a second target''s question on its own terms — resist the pull to spend the passage once.

    '
  type: constraint
  scope: []
  provenance: data_mined
  evidence:
  - pair-0004
  - pair-0005
  n_supporting_pairs: 2
  checker_sketch: 'Over gold_annotations for one contract, build the interval set per category and test
    for character-range overlap across category pairs; applicable to a decision when its category''s gold
    spans overlap the gold spans of at least one other in-scope category. Compliance: the model''s output
    assigns the overlapping passage to both categories rather than to one, with the other receiving an
    AbsenceClaim or an unrelated span.

    '
  defect_argument: 'pair-0004 and pair-0005 present the same two spans in both directions, so each span
    carries both gold labels inside its own contract: IHSI [3736:4373] is Minimum Commitment in 0004-A
    and Revenue/Profit Sharing in 0005-B, and SIBANNAC [3753:4384] mirrors it. The symmetry is internal
    to each document, so this is not the twin-document inconsistency defect — it is the deliberate multi-label
    annotation that mining_config.yaml excludes from same-contract mining by design. Independently corroborated
    in batch cm-003, where six pairs show one contract carrying both a floor and a ceiling extraction;
    the per-batch evidence rule prevents citing them here.

    '
