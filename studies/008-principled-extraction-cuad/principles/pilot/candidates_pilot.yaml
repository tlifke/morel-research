- id: g07
  statement: Exactly one Agreement Date is extracted per contract and the span is the date text alone,
    excluding the surrounding execution wording and excluding any date appearing in a header, a footer,
    or a recital.
  trigger_guidance: Consider once the introductory paragraph has been read; the competing candidates are
    the recital dates, the running-header date, and the two signature-page dates.
  type: constraint
  scope:
  - Agreement Date
  provenance: atticus_guidelines
  evidence:
  - Handbook, Agreement Date, IS list (p.7) — search order is introductory paragraph, then cover page,
    then the later of the signature-page dates, with an explicit instruction not to label both signature
    dates
  - Handbook, Agreement Date, IS-NOT list (p.8) — the execution wording (dated / as of / entered into)
    is excluded from the span, as are dates in headers, footers, recitals and preliminary statements
  checker_sketch: 'Applicability: the Agreement Date decision, whenever gold marks the category present.
    Compliance, three conjunctive tests, all programmatic: (1) the predicted span list has length 1; (2)
    the span text does not contain dated / as of / entered into / made this; (3) the span''s located character
    offset does not fall inside a line matching a page-furniture pattern (page number, confidential-treatment
    legend, SEC exhibit header) nor inside a sentence beginning with WHEREAS or within a recitals block.
    Test (3) leans on the same furniture patterns D-15 already forces us to characterise, so it costs
    nothing extra. Note the interaction with D-15: gold spans that were split around embedded furniture
    may make test (3) fire on a span that matches gold, so report test (3) separately from (1) and (2)
    rather than collapsing to one boolean.'
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: null
    batch_id: null
