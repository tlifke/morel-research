id: 003-c3-bugfix-median
title: "C3 — fix the median bug so seeded tests pass"
summary: "Repair existing code against an existing failing test, without touching the test."
why: >
  Tier 3 is the first modify-existing-code tier: the agent must read seeded
  code, localize a bug from failing tests, and fix only the implementation.
claim: "Complexity floor: which model tiers clear which task tiers"
description: >
  The repository contains py/stats.py and py/test_stats.py. Two tests
  currently fail because median() is wrong for even-length input (it must
  return the average of the two middle values). Fix py/stats.py so all tests
  in py/test_stats.py pass. Do not modify py/test_stats.py.
