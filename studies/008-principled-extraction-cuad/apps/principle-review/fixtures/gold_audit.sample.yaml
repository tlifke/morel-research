  duplicate_search:
    enabled: true
    scope: all 510 CUAD contracts, including model_train
    method: exact whitespace-normalized passage match of the gold span in another contract; counterparts
      ranked by document containment over 8-gram sketches; a passage shorter than 60 normalized characters
      is not searched
    min_match_chars: 60
    n_records_with_counterpart: 6
    n_records_searched: 10
  fuzzy_detector:
    enabled: true
    implementation: scripts/mine_contrastive_pairs.py (Space, jaccard_block, terms, chunk_text), imported,
      not reimplemented
    mining_config_version: mining_v1
    metric: idf_weighted_jaccard
    similarity_threshold: 0.2
    min_terms_per_unit: 8
    top_k_per_query: 1
    context_expansion:
      min_span_chars: 120
      window_chars: 120
      apply_to:
      - present_absent
      note: 'Gold spans shorter than min_span_chars are compared as span-plus-context (window_chars of
        contract text on each side, clipped to the document). It is what makes Agreement Date mineable
        at all: the 16-character date carries no distinguishing terms and the surrounding preamble is
        precisely the signal. Pairs record both the verbatim span (`text`) and the compared string (`match_text`),
        with `context_expanded: true` when they differ.

        '
      apply_to_note: 'Applied to present-vs-absent mining only, decided after inspecting a first pass.
        Cross-label mining asks "do these two *annotated* passages look alike"; expanding one of them
        into its neighbourhood answers a different question, and empirically it manufactured Agreement-Date-vs-Governing-Law
        pairs whose only shared material was the preamble around the date. In cross-label mining a span
        too short to clear min_terms_per_unit is simply dropped, which is why Agreement Date contributes
        no cross-label pairs.

        '
    min_doc_containment: 0.15
    gate_rationale: 'the miner''s present_absent threshold answers ''does a passage resembling category
      C exist where C is absent'', which is a broader question than ''is there a near-duplicate document
      with the opposite label''. Ungated it returns mostly unrelated contracts sharing legal boilerplate.
      The document-containment floor restricts it to genuine near-twins; see detector_comparison for what
      the gate discards. Known residual failure mode at this gate: CUAD entries that are fragments of
      one filing (a continuation excerpt or annex) score moderate containment and share boilerplate, but
      their absence labels are legitimately correct because the fragment does not contain the clause.
      Read the passage before trusting a fuzzy hit'
  detector_comparison:
    unit: one gold span with at least one disagreeing counterpart
    exact_normalized: 4
    fuzzy_idf_jaccard: 3
    fuzzy_idf_jaccard_ungated: 22
    both: 1
    exact_only: 3
    fuzzy_only: 2
    union: 6
    discarded_by_containment_gate: 19
    note: 'counts are over the whole population of the sampled splits, not over the random draw. exact_only
      and fuzzy_only are both non-empty: the detectors have different failure modes and neither subsumes
      the other'
  draws:
    random: 6
    duplicate_census: 6
    census_definition: 'every gold span in the sampled splits whose passage appears verbatim in another
      contract where the same category is marked_absent, not_annotated, or annotated only elsewhere in
      that contract. This is an exhaustive census of candidates for inconsistent_across_duplicates, NOT
      a random draw: label disagreement is ~0.3% of spans, so a random sample would contain none. Census
      records must be reported separately and must never enter the random sample''s defect rate.'
  attribution: Gold spans from the Contract Understanding Atticus Dataset (CUAD) v1, The Atticus Project,
    licensed CC BY 4.0.
