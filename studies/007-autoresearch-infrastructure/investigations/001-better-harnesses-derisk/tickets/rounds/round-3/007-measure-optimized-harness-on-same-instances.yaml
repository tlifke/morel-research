id: 007-measure-optimized-harness-on-same-instances
title: "Re-run the same budget-approval instances with the optimized harness"
summary: "Evaluate the optimized harness on the original baseline instances for direct comparison."
why: >
  Measures the adaptation gain (claim 1) without confounding from instance variability.
  Running the same instances ensures a fair A/B comparison.
claim: "Claim 1 (adaptation closes most of the gap)"
description: >
  Load the optimized harness (prompt, tools, workflows) from ticket 006. Re-run the same
  5–10 instances that were used in the baseline (ticket 005) with the optimized harness.
  Log trajectories in the same JSON format as baseline. Record per-instance: task_id,
  outcome, accuracy_score, tokens_used. Compute delta accuracy (optimized - baseline)
  and annotate key behavioral differences (e.g., improved tool use, fewer hallucinations).
acceptance:
  - "optimized-results.json contains results for the exact same instances as baseline, structured identically: task_id, outcome, accuracy_score, tokens_used per instance"
  - "optimized-trajectories.jsonl contains full trajectory data per instance"
  - "summary computes per-instance delta_accuracy and mean_improvement_pct vs baseline"
  - "A/B comparison summary (optimized vs baseline) is embedded or linked in optimized-results.json"
assignee_class: small-agent
agent_explanation: >
  Re-running the same instances with a fixed, documented harness is pure execution.
  No reasoning needed; small-agent loads the optimized harness, runs the SLM on the
  original 5–10 instances, logs trajectories and deltas. Frontier-model work unnecessary.
  Small-agent is sufficient and weakest class.
depends_on:
  - 006-one-harness-optimization-run
produces:
  - optimized-results.json
  - optimized-trajectories.jsonl
consumes:
  - optimized-harness.md
human_needed: []
gate: derisk-approval
