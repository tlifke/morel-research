- id: d09
  statement: 'A document that amends or restates an earlier agreement carries no responsive text
    for the clauses it reproduces from that agreement; only what the later document introduces
    is extracted.

    '
  trigger_guidance: 'Consider whenever the document announces itself as amending, restating or
    supplementing an earlier agreement, and its operative clauses read as reproductions of that
    agreement''s language.

    '
  type: absence
  scope: []
  provenance: data_mined
  evidence:
  - pair-0031
  - pair-0032
  - pair-0035
  n_supporting_pairs: 3
  checker_sketch: 'Applicable to a decision on a contract whose title or opening matches a
    derivative cue (/\bamendment\b|\baddendum\b|amended and restated/i) AND whose text shares a
    common substring of 400+ characters with another contract. Compliance: the decision is an
    AbsenceClaim, or its spans fall outside the shared substring. The substring computation is a
    one-off; `scripts/scan_split_contamination.py` already produces containment scores that stand
    in for it.

    '
  defect_argument: 'Three pairs from one batch, all present-vs-absent, all pointing the same way:
    the Variable Separate Account unconditional capital agreement carries Minimum Commitment spans
    at [1280:2748], [3516:4041] and [15110:15202], while the AGL Separate Account II filing —
    the same instrument with the same defined terms, the same Specified Minimum Percentage
    machinery and near-identical wording — is gold-absent for Minimum Commitment across the whole
    document. Three independent passages in one twin pair rule the same way, which is more than a
    single annotator slip and reads as a rule about which of two related filings carries the
    annotation. Excluded from the count: pair-0034, where the two Excite sponsorship agreements
    differ in the operative impressions clause itself rather than in filing status, so it does not
    bear on the derivative question.

    '
