# PILOT candidate set — data-mined arm. AWAITING CURATION (gate G2).
#
# Provenance: data_mined. Proposed by claude-opus-5 under the pinned prompt
# `principles/pilot/prompts/proposer_v1.md`, over the 7 contrastive-pair
# batches composed by `scripts/run_proposer.py` from
# `principles/pilot/mined_pairs.jsonl` (38 pairs, pair-0001..pair-0038).
#
# INVOCATION: the proposer ran as a Claude Code SUBAGENT, not as an Anthropic
# API call — no ANTHROPIC_API_KEY was available in the environment. Same model
# family, same pinned prompt text, same batch composition, same mechanical
# filters as `run_proposer.py` implements. What differs from the pinned method
# is the transport and therefore the sampling parameters: `temperature: 1.0`
# was not settable, and no token usage was recorded. Every record below carries
# `proposer.invocation: subagent` so this is never mistaken for an API run.
# Raw per-batch reasoning: `data/responses/proposer_v1_cm-00N.json` (gitignored).
#
# SOURCE INDEPENDENCE: the proposer did not read
# `candidates_guidelines.yaml`, the CUAD Labeling Handbook, or anything in
# `literature/`. Its evidence was the mined pairs plus the CUAD v1 category
# one-liners in `data/raw/category_descriptions.csv`. Overlap between this file
# and the guidelines arm is a designed measurement.
#
# 18 candidates were drafted across the 7 batches; 8 survive. None were lost to
# the mechanical filter (every draft carried in-batch evidence, a real checker
# sketch, a statement and a valid type) — all 10 losses were the three
# editorial screens, 8 of them screen 3 (convention vs defect). Discards and
# their reasons are itemised per batch in the response files.
#
# `review` blocks are null throughout. Claude proposes; Claude does not lock.
#
# CUAD is released by The Atticus Project under CC BY 4.0.

- id: d01
  statement: >
    Extract the minimal expression that answers the target question, clipped out
    of the sentence that carries it, rather than the whole containing sentence.
  trigger_guidance: >
    Consider whenever the answer to a target is a short self-contained value —
    a date, a jurisdiction, a named amount — embedded in a longer recital or
    preamble sentence.
  type: preference
  scope:
    - Agreement Date
  provenance: data_mined
  evidence:
    - pair-0001
    - pair-0002
    - pair-0003
  n_supporting_pairs: 3
  checker_sketch: >
    Applicable when gold has a non-empty Extraction for the target and every
    gold span is (a) under 40 characters, (b) fully matched by a date regex
    such as \d{1,2}(st|nd|rd|th)?\s+day\s+of\s+\w+,?\s+\d{4} or
    \w+\s+\d{1,2},\s+\d{4}, and (c) a proper substring of the sentence
    containing it, where sentences are cut on /[.;]\s|\n\n/. Compliance:
    the emitted span set matches gold under the same length and regex tests
    rather than reproducing the enclosing sentence.
  defect_argument: >
    Three gold spans, three different contracts, lengths 22 / 19 / 21
    characters, all clipped identically out of an execution recital. A single
    over-tight span would be a plausible annotation slip; three independent
    contracts converging on the same boundary is a convention. The
    Revenue/Profit Sharing side of these three pairs is mining noise (all three
    share one promiscuous span whose only common material is "day of"); this
    principle is read off the A sides only.
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: proposer_v1
    batch_id: cm-001
    invocation: subagent

- id: d02
  statement: >
    A passage that independently satisfies more than one target's definition is
    extracted under each of them; targets are not mutually exclusive.
  trigger_guidance: >
    Consider whenever a single clause has already been assigned to one target
    and would also answer a second target's question on its own terms — resist
    the pull to spend the passage once.
  type: constraint
  scope: []
  provenance: data_mined
  evidence:
    - pair-0004
    - pair-0005
  n_supporting_pairs: 2
  checker_sketch: >
    Over gold_annotations for one contract, build the interval set per
    category and test for character-range overlap across category pairs;
    applicable to a decision when its category's gold spans overlap the gold
    spans of at least one other in-scope category. Compliance: the model's
    output assigns the overlapping passage to both categories rather than to
    one, with the other receiving an AbsenceClaim or an unrelated span.
  defect_argument: >
    pair-0004 and pair-0005 present the same two spans in both directions, so
    each span carries both gold labels inside its own contract: IHSI
    [3736:4373] is Minimum Commitment in 0004-A and Revenue/Profit Sharing in
    0005-B, and SIBANNAC [3753:4384] mirrors it. The symmetry is internal to
    each document, so this is not the twin-document inconsistency defect —
    it is the deliberate multi-label annotation that mining_config.yaml
    excludes from same-contract mining by design. Independently corroborated in
    batch cm-003, where six pairs show one contract carrying both a floor and a
    ceiling extraction; the per-batch evidence rule prevents citing them here.
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: proposer_v1
    batch_id: cm-002
    invocation: subagent

- id: d03
  statement: >
    An obligation stated purely as a proportion of an outcome answers the
    sharing target, while the same obligation answers the minimum-commitment
    target once it also guarantees a fixed floor.
  trigger_guidance: >
    Consider on any royalty, fee or revenue-share clause: check whether it names
    a guaranteed amount or a "minimum"/"at least" qualifier alongside the
    percentage.
  type: disambiguation
  scope:
    - Minimum Commitment
    - Revenue/Profit Sharing
  provenance: data_mined
  evidence:
    - pair-0009
    - pair-0010
    - pair-0012
    - pair-0013
  n_supporting_pairs: 4
  checker_sketch: >
    For each gold span, compute two booleans over the span text: HAS_SHARE =
    match of /\d+(\.\d+)?\s*%|percent/ near /revenue|sales|profit|royalt/, and
    HAS_FLOOR = match of /\bminimum\b|\bat least\b|\bno less than\b|\bguarantee/
    or a currency literal /\$\s?[\d,]+/ in the same span. Applicable to a
    Minimum Commitment or Revenue/Profit Sharing decision when the contract
    contains at least one span with HAS_SHARE true. Compliance: spans with
    HAS_FLOOR true appear in the Minimum Commitment decision; spans with
    HAS_SHARE true and HAS_FLOOR false appear in the Revenue/Profit Sharing
    decision.
  defect_argument: >
    Four pairs across three contracts point the same way, and two of them
    (pair-0012 Pacificap, pair-0010 / pair-0013 Virtuoso) are same-contract
    near-verbatim contrasts where the annotator made both calls on adjacent
    sentences — "agrees to share a minimum of $50,000.00 annually" against
    "agrees to share 10% of the net revenue", and "minimum annual royalties"
    against "a running royalty ... based upon NET SALES". A mislabel does not
    reproduce itself in that pattern in three unrelated documents. Excluded
    deliberately: pair-0006, where the same amount is annotated under both
    categories in two places in one contract, and pair-0007, where near-identical
    guarantee language receives two labels — those are the weak side of this
    boundary and support nothing.
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: proposer_v1
    batch_id: cm-002
    invocation: subagent

- id: d04
  statement: >
    A guaranteed floor qualifies for the minimum-commitment target whichever
    party it binds, and whatever it is a floor on — supply, payment or access —
    not only a buyer's purchase obligation.
  trigger_guidance: >
    Consider whenever a clause states a guaranteed minimum quantity or amount
    but the obligated party is the supplier rather than the buyer, or the thing
    guaranteed is not a purchase; the target's one-line definition reads
    narrower than the convention.
  type: constraint
  scope:
    - Minimum Commitment
  provenance: data_mined
  evidence:
    - pair-0008
    - pair-0011
    - pair-0012
  n_supporting_pairs: 3
  checker_sketch: >
    Applicable to a Minimum Commitment decision when the contract contains a
    sentence matching /\b(minimum|at least|no less than)\b/ within 200
    characters of a quantity token (/\d|\*{3,}|\[\*+\]/) AND the subject of
    the obligation is not the purchasing party — approximated by testing
    whether the sentence matches /\b(supply|deliver|provide|share|allocate|
    make available)\b/ rather than /\b(buy|purchase|order)\b/. Compliance:
    the decision is an Extraction covering that sentence rather than an
    AbsenceClaim.
  defect_argument: >
    Three spans across two contracts label a floor that runs the wrong way for
    the literal definition: Excite@Home "will supply to e-centives a minimum of
    ***** records" (pair-0008), the same construction for General Program
    Members (pair-0011), and a payer-side "agrees to share a minimum of
    $50,000.00 annually" (pair-0012). Corroborated outside this batch by
    pair-0022, where "New Shippers will have access to a minimum of ten percent
    (10%) of the Available Capacity" is Minimum Commitment — an access right,
    not a purchase at all. This is the highest-leverage candidate in the set
    because a reader applying the printed definition literally would return an
    AbsenceClaim on every one of these contracts.
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: proposer_v1
    batch_id: cm-002
    invocation: subagent

- id: d05
  statement: >
    When two targets differ only in the direction of a threshold, assign a
    clause by which side of the threshold it binds on — a lower bound the
    obligated party must meet, or an upper bound above which supply is capped,
    conditioned or repriced.
  trigger_guidance: >
    Consider on any clause naming a quantity threshold, especially where the
    same quantity, forecast or capacity is bounded in two places in one
    contract.
  type: disambiguation
  scope:
    - Minimum Commitment
    - Volume Restriction
  provenance: data_mined
  evidence:
    - pair-0014
    - pair-0015
    - pair-0016
    - pair-0018
    - pair-0019
    - pair-0020
    - pair-0022
    - pair-0023
  n_supporting_pairs: 8
  checker_sketch: >
    Applicable to a Minimum Commitment or Volume Restriction decision when the
    contract contains a sentence with a quantity token (/\d|\*{3,}|\[\*+\]/)
    and a bound cue. LOWER cues: /\bminimum\b|\bat least\b|\bno less than\b|
    \bwithin\b.{0,40}%/. UPPER cues: /\bmaximum\b|\bup to\b|\bin excess of\b|
    \bexceed(ing|s)?\b|\bnot required to.{0,40}more than\b|\bno more than\b/.
    Compliance: spans carrying LOWER cues land in the Minimum Commitment
    decision and spans carrying UPPER cues land in the Volume Restriction
    decision; a span whose cue class contradicts the decision it appears in is
    a violation. Strengthen by also requiring, when both cue classes fire in one
    contract, that both decisions be Extractions.
  defect_argument: >
    Eight pairs across four contracts, six of them same-contract contrasts, and
    four of those near-verbatim: an identical content list headed "A minimum of:"
    against "Up to:" (pair-0014, pair-0016, pair-0018), and adjacent definitions
    of "Minimum Quantity" and "Maximum Quantity" differing by one word
    (pair-0015). The mechanism pairs (pair-0019 Vericel, pair-0020 MediWound)
    and the capacity-allocation pairs (pair-0022, pair-0023 Range Resources)
    reproduce the same split on clauses that share no vocabulary with the list
    pairs. This is the most strongly evidenced convention in the pilot and the
    only one that survives on within-contract minimal pairs alone. Excluded:
    pair-0017 and pair-0021, where three adjacent sentences of one DTMF
    performance specification are split across the two categories on the
    presence of the token "minimum" in a parenthetical — neither span matches
    either definition and the labels look keyword-driven.
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: proposer_v1
    batch_id: cm-003
    invocation: subagent

- id: d06
  statement: >
    Claim absence when the document does not state the specific fact the target
    asks for, even where it states a neighbouring fact that plausibly stands in
    for it.
  trigger_guidance: >
    Consider whenever the document supplies something adjacent to the requested
    value — an effective date where an execution date is asked for, a venue
    where a governing law is asked for — and the temptation is to answer with
    the near miss rather than claim absence.
  type: absence
  scope:
    - Agreement Date
  provenance: data_mined
  evidence:
    - pair-0026
    - pair-0027
  n_supporting_pairs: 2
  checker_sketch: >
    Applicable to an Agreement Date decision when gold is_impossible is true
    for that category AND the contract's first 2,000 characters contain a date
    literal (/\w+\s+\d{1,2},\s+\d{4}|\d{1,2}\/\d{1,2}\/\d{2,4}/) that is NOT
    preceded within 60 characters by an execution cue
    (/\bmade\b|\bentered into\b|\bexecuted\b|\bdated\b|\bday of\b/) — i.e. a
    date is present but not as a signing date. Compliance: the decision is an
    AbsenceClaim rather than an Extraction of the near-miss date.
  defect_argument: >
    WEAKLY SUPPORTED — flagged for Tyler rather than asserted. pair-0026 is the
    real evidence: the Iovance strategic alliance agreement prints "Effective
    Date: April 17, 2017" in its opening line and defines itself as entered
    into "as of the date set forth above", yet Agreement Date is gold-absent
    for that whole contract, while the structurally identical Adaptimmune
    preamble yields a "23rd day of September, 2016" extraction. pair-0027 adds
    only the weaker half (a cover page with no date at all, also gold-absent).
    Effective support is n=1 for the informative claim. It is proposed because
    absence rulings are the decision type this study cares most about and
    Agreement Date produced no cross-label pairs at all, so this is the only
    absence candidate its evidence offers; rejecting it is a legitimate outcome
    and would itself record that the mining recovered no Agreement Date
    convention. Deliberately excluded: pair-0025, where the identical blank
    signing frame is annotated in Leju and gold-absent in ChinaRealEstate —
    a near-duplicate-document contradiction (D-15), not a convention.
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: proposer_v1
    batch_id: cm-005
    invocation: subagent

- id: d07
  statement: >
    Document furniture interrupting a passage is carried along inside the
    extracted span, but furniture standing on its own is never extracted.
  trigger_guidance: >
    Consider whenever a page footer, redaction legend, filing-provenance line
    or page number falls in the middle of the passage being extracted, and the
    tidy instinct is to drop it or to split the passage in two.
  type: procedure
  scope: []
  provenance: data_mined
  evidence:
    - pair-0033
  n_supporting_pairs: 1
  checker_sketch: >
    Define a furniture regex F = /omitted portions of this exhibit|request for
    confidential treatment|^\s*Source:\s.+,\s\d{1,2}\/\d{1,2}\/\d{4}|^\s*Page
    \d+/m. Applicable to a decision when at least one gold span contains a
    match of F strictly inside it (match start > span start and match end <
    span end). Compliance: the emitted span reproduces the furniture in place;
    violations are (a) emitting the passage with the furniture stripped, or
    (b) emitting two spans split at the furniture boundary. A second,
    complementary check: no emitted span is wholly matched by F.
  defect_argument: >
    ONE PAIR, and stated as such. It qualifies under the minimal-pair
    exception in a stronger form than a within-contract contrast: the gold-absent
    B text is a VERBATIM SUBSTRING of the A gold span. GluMobile Content
    License Agreement2 [5349:6056] swallows an SEC confidential-treatment
    legend and a "Source: GLU MOBILE INC, S-1/A, 3/19/2007" line mid-clause and
    keeps them inside the Minimum Commitment span; the same characters standing
    alone in sibling exhibit 3 are unannotated. The identical characters are
    inside a span in one place and outside every span in another, which is the
    tightest contrast the present-absent mining can produce. Flagged for Tyler
    as the record most in need of a second confirming instance before it is
    locked — it is cheap to test by grepping the manifest for gold spans
    containing F internally.
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: proposer_v1
    batch_id: cm-007
    invocation: subagent

- id: d08
  statement: >
    An obligation carrying no quantified threshold does not satisfy a target
    that asks for one, however emphatic the commitment language.
  trigger_guidance: >
    Consider whenever a clause reads as a strong undertaking — "commits to",
    "shall use commercially reasonable efforts", "agrees that" — but names no
    number, quantity or rate.
  type: absence
  scope:
    - Minimum Commitment
  provenance: data_mined
  evidence:
    - pair-0036
    - pair-0037
    - pair-0038
  n_supporting_pairs: 3
  checker_sketch: >
    Applicable to a Minimum Commitment decision when gold is_impossible is true
    for that category AND the contract contains at least one sentence matching
    an undertaking cue — the alternation of "commits to", "agrees that",
    "agrees to", "undertakes", and "shall use" followed within 40 characters by
    "efforts" — with NO quantity token (/\d|\*{3,}|\[\*+\]/) in the same
    sentence. Compliance: the decision is an AbsenceClaim rather than an
    Extraction of the unquantified undertaking.
  defect_argument: >
    Read off the ABSENT sides, which is what makes it safe here. is_impossible
    is a contract-level gold flag rather than a span judgement, so the three B
    contracts — Xybernaut (a termination right), MacroGenics ("shall use
    Commercially Reasonable Efforts to Commercialize"), Mrs Fields (a
    use-restriction covenant) — are three independent contract-level rulings
    that unquantified undertakings do not make a minimum commitment. The A
    sides of these same pairs are junk (colon-terminated list heads of 15, 35
    and 144 characters, neighbourhood-labelled) and are NOT used as positive
    evidence; the principle would be unsupported if it depended on them.
    Violable in an obvious way: a model reading "commits to" or "Commercially
    Reasonable Efforts" as a commitment emits a schema-valid Extraction where
    gold says absent.
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null
  proposer:
    model: claude-opus-5
    prompt_version: proposer_v1
    batch_id: cm-007
    invocation: subagent
