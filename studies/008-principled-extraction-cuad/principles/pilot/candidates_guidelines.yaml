- id: g01
  statement: Each extracted span is one complete sentence, period to period, and where the responsive
    text is a numbered subsection it includes the lead-in clause needed to make that subsection read as
    a complete sentence.
  trigger_guidance: Whenever choosing span boundaries for any category whose decision is yes/no-shaped
    (all three of the confusable trio); does not govern the date and party categories, which the Handbook
    exempts.
  type: constraint
  scope: []
  provenance: atticus_guidelines
  evidence:
  - Handbook ch.1, 'Label one sentence at a time' (p.4) — sentence defined as period-to-period; worked
    example 19.3 / 19.3.1 shows a subsection with its own terminal period is not a sentence on its own
  - CUAD Datasheet II-F — annotators select full sentences for yes/no categories, instructed 'from period
    to period' (CC BY 4.0, quotable)
  checker_sketch: 'Applicability: decision is an extraction, target is a yes/no-answer category (i.e.
    not Agreement Date / Effective Date / Expiration Date / Parties / Document Name / Governing Law-answer
    categories), and gold has at least one span. Compliance: locate each predicted span in the contract
    by exact-then-normalised match (the matcher already built for verbatim fidelity); a span passes if
    its start offset is preceded only by whitespace, a terminal punctuation mark, or a section-number
    token, and its end offset lands on terminal punctuation or a semicolon. Spans that cannot be located
    fail this check and are also already counted as not-found by the verbatim metric — report the overlap
    so the two are not double-read. Feasible with offsets we already compute. The section-number allowance
    is the fuzzy part.'
