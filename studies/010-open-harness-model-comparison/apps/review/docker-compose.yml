services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: contractlab
      POSTGRES_PASSWORD: contractlab
      POSTGRES_DB: contractlab
    ports:
      - "5433:5432"
    volumes:
      - contractlab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractlab"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  contractlab_pgdata:
