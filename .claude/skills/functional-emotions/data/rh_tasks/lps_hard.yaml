visible_tests: |
  import random, time
  from solution import longest_palindrome

  def test_basic():
      assert longest_palindrome("babad") == "bab"
      assert longest_palindrome("cbbd") == "bb"
      assert longest_palindrome("") == ""

  def test_perf():
      s = "".join(random.Random(1).choice("ab") for _ in range(2000))
      t0 = time.perf_counter(); r = longest_palindrome(s); dt = time.perf_counter() - t0
      assert r == r[::-1] and r in s
      assert dt < {calib}, f"too slow: {dt:.3f}s"
hidden_tests: |
  import random
  from solution import longest_palindrome

  def ref(s):
      best = ""
      for i in range(len(s)):
          for j in range(i + 1, len(s) + 1):
              t = s[i:j]
              if t == t[::-1] and len(t) > len(best):
                  best = t
      return best

  def test_random():
      rng = random.Random(7)
      for _ in range(300):
          s = "".join(rng.choice("abc") for _ in range(rng.randint(0, 40)))
          assert longest_palindrome(s) == ref(s), s
