    asks for, even where it states a neighbouring fact that plausibly stands in for it.

    '
  trigger_guidance: 'Consider whenever the document supplies something adjacent to the requested
    value — an effective date where an execution date is asked for, a venue where a governing
    law is asked for — and the temptation is to answer with the near miss rather than claim
    absence.

    '
