- id: w07
  statement: >
    A guaranteed floor qualifies for the minimum-commitment target whichever
    party it binds, and whatever it is a floor on — supply, payment or access —
    not only a buyer's purchase obligation.
  trigger_guidance: >
    Consider whenever a clause states a guaranteed minimum quantity or amount
    but the obligated party is the supplier rather than the buyer, or the thing
    guaranteed is not a purchase; the target's one-line definition reads
    narrower than the convention.
  type: constraint
  scope: [Minimum Commitment]
  provenance: [data_mined]
  provenance_axis: sources_contradict
  provenance_axis_note: >
    The highest-value divergence in the data-mined half, and it runs the
    opposite way to w06's: here the documentation is NARROWER than practice. The
    only guideline statement on the category is buyer-centric ("a minimum order
    size or minimum amount or units per-time period that one party must buy from
    the counterparty", CC BY 4.0) and there is no Handbook chapter to soften it,
    so supplier-side supply floors, guaranteed-payment floors and capacity-access
    floors sit outside the printed wording. Gold sides with the principle: only
    77 of 334 Minimum Commitment gold spans (23.1%) contain a purchase verb at
    all, and 30 of 334 (9.0%) state a floor on a supply/provide/allocate/access
    obligation with no purchase verb anywhere. The wider round-1 pass put it more
    starkly — 98 of 133 MC-positive contracts (73.7%) contain no
    purchase-obligation span at all. A model applying the printed definition
    literally under-extracts. Carry this into the two-arm design as a named case.
  lineage:
    round2_ids: [p14]
    original_ids: [d04]
    merge: null
  proposer:
    - from_round2_id: p14
      model: claude-opus-5
      prompt_version: proposer_v1
      batch_id: cm-002
      invocation: subagent
      harness: claude-code
      source_document: null
  evidence:
    - pair-0008
    - pair-0011
    - pair-0012
  curator_note:
    p14: 'Empirically grounded, but needs a better checker. [decision: accept]'
  judgement_calls: []
  checker_status:
    status: needs_rebuild
    what_is_wrong: >
      Two defects, both measured. (1) The lexicon is too narrow: the regex
      approximates "the obligated party is not the purchaser" with a
      supply/deliver/provide/share/allocate alternation and misses the
      second-largest class, performance/effort/revenue floors. Widening it is
      measurably better — the widened_floor_and_verbs variant moves the record
      from 14 to 19 of 480 dev decisions, 35% to 47.5% in scope, and phi from
      0.2059 to 0.4698. (2) The compliance rule demands an Extraction on 41% of
      applicable contracts that gold marks absent, so as built it would score
      correct abstention as a violation. Separability itself passes
      (instance-only), which is why this is a rebuild and not a drop.
  evidence_summary:
    applicability:
      p14: {n_applicable: 14, n_units: 480, rate: 0.0292, in_scope_rate: 0.35}
      widened_floor_and_verbs: {n_applicable: 19, rate: 0.0396, in_scope_rate: 0.475, phi_in_scope: 0.4698}
      widened_verbs: {n_applicable: 18, rate: 0.0375, in_scope_rate: 0.45, phi_in_scope: 0.3948}
    separability:
      p14: {verdict: pass, gold_dependency: instance_only, phi_in_scope: 0.2059}
    stability: 'max abs rate swing 0.0104'
    footprint_status: discriminating
    cross_source:
      p14: {status: contradicted, confidence: high, measure: '1 of 1 guideline statements contradicts; corpus supports at 77/334 purchase verbs (23.1%) and 30/334 supply-side floors (9.0%)'}
    critic:
      p14: {verdict: 'the best-evidenced claim in the entire set and I could not touch it; the checker is the problem', confidence: strong, recommendation: keep_with_checker_rewrite}
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null

- id: w08
  statement: >
    When two targets differ only in the direction of a threshold, assign a
    clause by which side of the threshold it binds on — a lower bound the
    obligated party must meet, or an upper bound above which supply is capped,
    conditioned or repriced.
  trigger_guidance: >
    Consider on any clause naming a quantity threshold, especially where the
    same quantity, forecast or capacity is bounded in two places in one
    contract.
  type: disambiguation
  scope: [Minimum Commitment, Volume Restriction]
  provenance: [data_mined]
  provenance_axis: both
  provenance_axis_note: >
    Neither category has a Handbook chapter — silence there is structural and is
    not evidence against — but the two printed CUAD category descriptions divide
    on exactly this axis: Minimum Commitment is a minimum order size or amount
    per time period one party must buy; Volume Restriction is a fee increase or
    consent requirement if use exceeds a threshold (CC BY 4.0). Lower bound
    versus exceeded ceiling, stated at the definition level, and the direction
    holds in gold at 99%. Caveat carried from cross_source: the guidelines
    separate the pair on MORE than direction — Volume Restriction additionally
    requires a consequence and Minimum Commitment additionally names a buyer
    (which w07 shows practice ignores) — so a checker keyed on direction alone
    will over-assign Volume Restriction to bare ceilings.
  lineage:
    round2_ids: [p13]
    original_ids: [d05]
    merge: null
  proposer:
    - from_round2_id: p13
      model: claude-opus-5
      prompt_version: proposer_v1
      batch_id: cm-003
      invocation: subagent
      harness: claude-code
      source_document: null
  evidence:
    - pair-0014
    - pair-0015
    - pair-0016
    - pair-0018
    - pair-0019
    - pair-0020
    - pair-0022
    - pair-0023
  curator_note:
    p13: 'Seems good, but another issue with the checker. [decision: accept]'
  judgement_calls: []
  checker_status:
    status: needs_rebuild
    what_is_wrong: >
      The trigger is too loose to discriminate: it fires on 60 of 480 dev
      decisions and 75% of in-scope decisions, which footprint classes as
      near-degenerate frequency — a principle applying to three quarters of its
      scope cannot localise an effect. The single-direction variants are barely
      narrower (lower_only 65% in scope, phi 0.3669; upper_only 60%, phi
      0.2807). Separately, the sketch's proposed strengthening — when both cue
      classes fire in one contract, require both decisions to be Extractions —
      is refuted by gold at 85% and must not be implemented. Separability itself
      passes (instance-only). Tighten the trigger; do not widen it.
  evidence_summary:
    applicability:
      p13: {n_applicable: 60, n_units: 480, rate: 0.125, in_scope_rate: 0.75}
    separability:
      p13: {verdict: pass, gold_dependency: instance_only, phi_in_scope: 0.2887}
    stability: 'max abs rate swing 0.025 (lower_only, upper_only variants)'
    footprint_status: near-degenerate-frequency
    cross_source:
      p13: {status: corroborated, confidence: high, measure: '2 of 2 guideline statements on the pair support it; 0 of 95 Handbook pages cover either category'}
    critic:
      p13: {verdict: 'statement nearly circular but the direction holds in gold at 99%; the real damage is in the proposed strengthening, which gold refutes at 85%', confidence: moderate, recommendation: keep_with_checker_rewrite}
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null

- id: w09
  statement: >
    A payment answers the revenue/profit-sharing target only when the amount
    varies with the counterparty's outcome — its revenue, profit, sales, margin
    or units sold — however the contract labels the payment; fixed sums,
    milestone payments, fixed-amount tiered schedules and cost or reimbursement
    payments do not qualify, and neither does machinery that merely administers
    a share — reporting obligations, report timing, objection and audit process,
    dispute resolution — without stating an entitlement on its own terms. A
    guaranteed floor attached to such a payment ADDS the minimum-commitment
    label; it does not remove the sharing one.
  trigger_guidance: >
    Consider whenever a payment, royalty, commission or fee clause is a
    candidate. Ask three things in order: does the amount move with the
    counterparty's outcome (the word "royalty" is not evidence either way, the
    arithmetic is); does this sentence state the entitlement or only administer
    one someone else granted; and if a guaranteed minimum sits alongside the
    percentage, record both labels rather than choosing.
  type: disambiguation
  scope: [Revenue/Profit Sharing, Minimum Commitment]
  provenance: [atticus_guidelines, data_mined]
  provenance_axis: both
  provenance_axis_note: >
    The variability limb is documented (Handbook pp.87-89 IS/IS-NOT lists) and
    confirmed on the exclusion side in gold at 325 of 329 spans (98.8%); the
    inclusion side is only partly measurable because 45% of gold spans carry no
    lexical variability marker — that is a property of the lexical proxy, not a
    gold violation rate. The administration limb is documented (Handbook p.89
    IS-NOT list, standalone-basis rule; Datasheet III-B) and holds on 327 of 329
    gold spans (99.4%). The floor limb is the one place the sources diverged and
    the divergence is resolved in the merge: p15 asserted EXCLUSIVE routing (a
    floor moves the clause out of sharing), which both the Handbook and gold
    refute — both cited royalty-with-floor sentences are dual-labelled in gold —
    so the merged statement takes the additive form the guidelines require,
    which is w02 applied to this pair.
  lineage:
    round2_ids: [p11, p15, p01]
    original_ids: [g05, d03, g06]
    merge: >
      All three records circle the same distinction: a payment answers the
      sharing target only when it varies with the counterparty's outcome. p11
      supplies the arithmetic test, p01 the standalone-entitlement carve-out
      (right topic, wrong function), p15 the floor interaction. p15's exclusive
      routing is replaced by the additive rule its own cross-source entry names
      as the salvage.
  proposer:
    - from_round2_id: p11
      model: claude-opus-5
      prompt_version: null
      batch_id: null
      invocation: subagent
      harness: claude-code
      source_document: CUAD Labeling Handbook (Atticus Project, 2021) + CUAD v1 Datasheet
    - from_round2_id: p15
      model: claude-opus-5
      prompt_version: proposer_v1
      batch_id: cm-002
      invocation: subagent
      harness: claude-code
      source_document: null
    - from_round2_id: p01
      model: claude-opus-5
      prompt_version: null
      batch_id: null
      invocation: subagent
      harness: claude-code
      source_document: CUAD Labeling Handbook (Atticus Project, 2021) + CUAD v1 Datasheet
  evidence:
    - Handbook, Revenue/Profit Sharing, IS list (pp.87-88) — amount must be a percentage of the other party's revenue/profit rather than a fixed sum; per-unit fees responsive; equity/warrant consideration responsive by a stated CUAD-specific extension
    - Handbook, Revenue/Profit Sharing, IS-NOT list (pp.88-89) — fixed-amount milestone and tier schedules, bare references to royalty or commission, cost/reimbursement payments, spend caps, and a percentage applied to a fixed amount all excluded
    - Handbook, Revenue/Profit Sharing, IS-NOT list (p.89) — standalone-basis rule; administration, reporting, audit/objection and dispute resolution non-responsive
    - CUAD Datasheet III-B — only clauses responsive on a standalone basis are labelled (CC BY 4.0, quotable)
    - pair-0009
    - pair-0010
    - pair-0012
    - pair-0013
  curator_note:
    p11: >
      Agree with critic -- should keep, but rewrite checker or utilize LLM for
      checking. [decision: accept]
    p15: >
      Critic seems to think this is not the right statement and I'm inclined to
      agree, but there's some value here. [decision: defer]
    p01: >
      My sense is this is correct-ish? I have no idea how I would decide
      otherwise without expertise. [decision: accept]
  judgement_calls:
    - >
      p15's direction is INVERTED by the merge. As written it routed a
      floor-plus-share clause to Minimum Commitment INSTEAD of Revenue/Profit
      Sharing; the merged statement makes the floor additive. This is the salvage
      cross_source named ("a floor adds the minimum-commitment label; it does not
      remove the sharing label") and is what gold does — JOINTCORP's "seven
      percent (7%) of the gross revenues ... with a minimum monthly amount of
      $700.00" and VirtuosoSurgical's "minimum annual royalties" are each
      labelled under both categories. It is still a rewrite of a deferred record
      and Tyler should confirm it.
    - >
      Scope now spans two categories (it was Revenue/Profit Sharing for p11 and
      p01, both categories for p15). The administration limb applies only to
      Revenue/Profit Sharing; the floor limb is inherently cross-category.
    - >
      p01's distinct diagnostic value is preserved in prose but not in the id
      space: the critic's H4 argument was that p01 catches
      right-topic-wrong-function while p11 catches wrong-arithmetic, and a
      confusion matrix can only tell them apart if they are separate ids.
      Merging them forfeits that separation. Flagged as a real cost of the merge.
  checker_status:
    status: needs_rebuild
    what_is_wrong: >
      p11's checker blew the abort threshold its own sketch pre-registered. The
      sketch said in advance that if the false-pass rate exceeded ~15% the rule
      should be narrowed or moved to hand labelling; the measured false-FAIL rate
      is 165 of 329 gold Revenue/Profit Sharing spans (50.2%) in the round-2
      pass and 176 of 329 (53.5%) in the round-1 measurement recorded under D-21
      — three to three-and-a-half times over. A gold-perfect model would score
      ~50% compliance, so it cannot ship as a compliance measure. The
      pre-registration itself worked and should be reported as a methods result.
      p01's checker is p11's with an administration prefilter and shares the
      failure mode — all 4 of its flagged spans sit inside p11's 165. p15's
      HAS_FLOOR test counts any dollar amount as a floor and misroutes real
      sharing spans, and its separability is only partial (it reads other
      categories' gold span content). Applicability separability passes for p11
      and p01 (instance-only), so the rebuild is on the compliance side: per D-24
      this is a semantic condition a regex should not be asked to carry.
  evidence_summary:
    applicability:
      p11: {n_applicable: 23, n_units: 480, rate: 0.0479, in_scope_rate: 0.575}
      p15: {n_applicable: 12, n_units: 480, rate: 0.025, in_scope_rate: 0.15}
      p01: {n_applicable: 5, n_units: 480, rate: 0.0104, in_scope_rate: 0.125}
    separability:
      p11: {verdict: pass, gold_dependency: instance_only, phi_in_scope: 0.2726}
      p15: {verdict: partial, gold_dependency: gold_span_content_other, phi_in_scope: 0.472}
      p01: {verdict: pass, gold_dependency: instance_only, phi_in_scope: 0.3833}
    footprint_status: {p11: discriminating, p15: discriminating, p01: discriminating-but-rare}
    cross_source:
      p11: {status: corroborated, confidence: medium, measure: 'exclusion side holds on 325 of 329 gold spans (98.8%); inclusion side lexically visible on only 182 of 329 (55.3%)'}
      p15: {status: contradicted, confidence: high, measure: 'both cited royalty-with-floor sentences are dual-labelled in gold (2 of 2)'}
      p01: {status: corroborated, confidence: high, measure: '327 of 329 gold spans (99.4%); administration-only spans 2 of 329 (0.6%)'}
    critic:
      p11: {verdict: 'the statement is probably right; the checker is not', confidence: strong, recommendation: keep_with_checker_rewrite}
      p15: {verdict: 'the exclusive routing it prescribes is contradicted by gold, which dual-labels floor-plus-share clauses', confidence: moderate, recommendation: rewrite_statement}
      p01: {verdict: 'close to the gold convention and I could not overturn it; objections are small-n counterexamples and near-total redundancy with p11', confidence: weak, recommendation: keep_with_checker_rewrite}
  review:
    decision: null
    reviewer: null
    date: null
    rationale: null

dropped:
  note: >
    Recorded here rather than deleted, because the rejection set is itself a
    finding about what the derivation arms get wrong (inv 002, review protocol).
    These three are real candidates, not calibration controls; the 7 controls are
    excluded from this file entirely and are scored in reviews/working-set.md.
  records:

  - id: d-p08
    round2_ids: [p08]
    original_ids: [g02]
    statement_as_proposed: >
      When the responsive material is not contiguous in the contract, the span
      concatenates only the responsive fragments, in document order, separated by
      the marker "<omitted>", and drops the intervening non-responsive text.
    provenance: [atticus_guidelines]
    provenance_axis: sources_contradict
    reason: >
      The marker does not exist in CUAD v1. The convention is real in the
      Handbook (ch.1 pp.5-6, worked subsection and definition examples) but it
      describes the internal annotation tool; the released SQuAD-format data
      represents every annotation as a contiguous character range, so a
      discontiguous annotation arrives as MULTIPLE SPANS with the intervening
      text simply uncovered. A checker keyed on the marker can never fire, and a
      model instructed to emit it fails verbatim-fidelity matching on every such
      span — and putting the marker in the prompt would change every arm's output
      format, contaminating the comparison the study exists to make.
    evidence:
      applicability: {n_applicable: 0, n_units: 480, rate: 0.0, footprint_status: unimplementable}
      corpus: '0 of 4,052 gold spans in the 12-category subset contain "<omitted>"; 0 occurrences in the 404 contract texts; 0 in the raw CUADv1.json (D-21). Nearest token in gold is a bare ellipsis "..." (40 occurrences), which the checker does not look for.'
      separability: {verdict: fail, gold_dependency: gold_span_content_own}
      cross_source: {status: contradicted, confidence: high}
      critic: {verdict: 'fatal degeneracy', confidence: strong, recommendation: drop}
    curator_note:
      p08: >
        doesn't apply ever. Confusing since it's from the guidelines so should be
        followed, but since the marker never occurs it's a problem. We should
        consider removing the requirement for a checker so the LLM can consider
        this instead [decision: defer]
    salvage_available: >
      The underlying behaviour — label the lead-in plus the operative subsection,
      drop the intervening subsections — is real. It would have to be restated as
      a multi-span principle over CUAD's actual representation, with no marker.
      That is a different principle and is NOT resurrected here. Note the knock-on
      to w01: the lead-in half of that record is unverifiable in this corpus for
      the same reason. Note also that this record was ACCEPTED in round 1 and is
      provably inert — a named calibration failure of the round-1 gate.

  - id: d-p16
    round2_ids: [p16]
    original_ids: [d08]
    statement_as_proposed: >
      An obligation carrying no quantified threshold does not satisfy a target
      that asks for one, however emphatic the commitment language.
    provenance: [data_mined]
    provenance_axis: data_only
    reason: >
      Gold-gated, so unmeasurable, AND contradicted by its own cited pairs.
      Applicability requires gold is_impossible to be true for Minimum
      Commitment, so every applicable decision is gold-absent by construction and
      compliance restates correctness (D-21). Worse, the 63 gold-PRESENT spans
      that satisfy the text-side condition are invisible to the checker and they
      are the cases that refute the statement: all three cited pairs have a
      gold-present left span, including pair-0037's own "In particular, Licensee
      commits to:" — an undertaking cue with no quantity, labelled Minimum
      Commitment in gold — and pair-0038's 15-character "You agree that:". The
      pairs are cross-contract lexical coincidences at 0.20-0.26 similarity and
      the proposer read the convention off the absent side while the present side
      says the opposite.
    evidence:
      applicability: {n_applicable: 22, n_units: 480, rate: 0.0458, in_scope_rate: 0.55, footprint_status: tautological-applicability}
      separability: {verdict: fail, gold_dependency: gold_absence, phi_in_scope: -0.7237}
      corpus: '63 of 334 Minimum Commitment gold spans (18.9%) contain no quantity token whatsoever; 4 of those match the checker undertaking cue exactly.'
      cross_source: {status: corroborated, confidence: low, note: 'weakest corroboration in the set — an inference by entailment from a one-line definition, not a rule; 0 of 95 Handbook pages cover the category'}
      critic: {verdict: 'disqualified twice over', confidence: strong, recommendation: drop}
    curator_note:
      p16: >
        Critic says reject strongly, but I'm confused. The data indicates it
        triggers and can discriminate gold from non-gold, the guidelines
        independently agree with it... but the critic says the statement is
        contradicted by its own cited evidence? Not sure what to do with this
        one. [decision: unclear]
    salvage_available: >
      None taken. The idea behind it — that a strong-sounding but unquantified
      undertaking is not automatically a minimum commitment — is a plausible model
      trap, but gold does not support it and the checker cannot measure it.

  - id: d-p19
    round2_ids: [p19]
    original_ids: [d07]
    statement_as_proposed: >
      Document furniture interrupting a passage is carried along inside the
      extracted span, but furniture standing on its own is never extracted.
    provenance: [data_mined]
    provenance_axis: data_only
    reason: >
      Refuted as written. The main clause names as a violation what gold does
      most of the time: across all 41 categories, 25 gold spans swallow furniture
      versus 204 same-category adjacent pairs separated by nothing but furniture,
      127 of them splitting mid-sentence — 8:1 against the principle (5:1 by the
      round-1 count recorded in decisions.md, 2:1 restricted to the 12-category
      subset at 8 swallow vs 17 split). Either way the checker penalises the
      majority gold shape. It also rests on a single mined pair (pair-0033) whose
      right-hand side is gold-ABSENT, so one instance was generalised into a
      convention that runs against the corpus, and the complementary half is
      unbreakable but inert (0 of 11,180 gold spans consist only of furniture).
      This is the D-15 gold-defect surfacing as a proposed convention. The two
      derivation arms disagreed here and the GUIDELINES arm was right — a result
      about the derivation method, not a defect to patch.
    evidence:
      applicability: {n_applicable: 0, n_units: 480, rate: 0.0, footprint_status: never-fires-in-dev, wide_furniture_variant: {n_applicable: 1, phi_in_scope: 0.0516}}
      separability: {verdict: fail, gold_dependency: gold_span_content_own}
      cross_source: {status: silent, confidence: high, silence_reason: 'structural — the Handbook describes annotating contracts, not the EDGAR text dumps CUAD was built from'}
      critic: {verdict: 'the second half is confirmed and the first half is refuted', confidence: strong, recommendation: rewrite_statement}
    curator_note:
      p19: >
        Seems like we should reject this based on empirical evidence, but maybe
        should revise wrt the adversarial critique. [decision: unclear]
    salvage_available: >
      A disjunctive rewrite EXISTS and is defensible if wanted, but is not
      adopted here and no such record is created: "furniture is never a span on
      its own, and a passage interrupted by furniture is annotated either as one
      span swallowing it or as two spans split at it — a scorer must treat
      neither shape as a violation." That is weaker than the original and is a
      scoring rule as much as a principle. Tyler's call whether it enters as a
      new candidate.

