    rationale: Nondiscriminatory, but is clearly a vital principle
- id: p06
  statement: Governing Law covers only a clause designating the substantive law that governs
    the contract as a whole; venue, forum, jurisdiction-consent and arbitration clauses are
    not responsive, and neither is a law that governs only one section of the contract.
  trigger_guidance: Consider whenever a dispute-resolution or miscellaneous section is being
    read — these clauses frequently sit in the same paragraph as the true governing-law sentence,
    or replace it entirely.
  type: disambiguation
  scope:
  - Governing Law
  provenance: atticus_guidelines
  proposer:
    batch_id: null
    harness: claude-code
    invocation: subagent
    model: claude-opus-5
    prompt_version: null
    source_document: CUAD Labeling Handbook (Atticus Project, 2021) + CUAD v1 Datasheet
  evidence:
  - Handbook, Governing Law, IS-NOT list (p.12) — venue and arbitration clauses excluded,
    with four worked counter-examples (submission to exclusive jurisdiction, inconvenient-forum
    waiver, People's Court jurisdiction, consent to Denver courts)
  - Handbook, Governing Law, IS-NOT list (p.12) — law governing the interpretation of a single
    section is excluded; CUAD treats the label as whole-contract only
  - Handbook, Governing Law, IS list (p.12) — a cross-reference to another agreement's governing-law
    provision IS responsive (span only, no answer)
  checker_sketch: 'Applicability: the contract contains at least one sentence matching a venue
    pattern (exclusive jurisdiction | submits? to the jurisdiction | venue | inconvenient
    forum | arbitration | courts located in | courts situated in) — computed from instance
    text alone, no gold needed. Compliance: no predicted Governing Law span overlaps such
    a sentence unless that same sentence also matches the governing-law pattern (govern |
    construed | interpreted, near "law"). Sentence segmentation on contract text is the only
    moving part and it is already needed for g01. High confidence: this is the single most
    explicitly documented rule for any pilot category, and it is exactly the confusion the
    study predicted.'
  review:
    decision: accept
    reviewer: tyler
    date: '2026-08-16'
    rationale: Good coverage, critic agrees
- id: p07
  statement: Exactly one Agreement Date is extracted per contract and the span is the date
    text alone, excluding the surrounding execution wording and excluding any date appearing
    in a header, a footer, or a recital.
  trigger_guidance: Consider once the introductory paragraph has been read; the competing
    candidates are the recital dates, the running-header date, and the two signature-page
    dates.
  type: constraint
  scope:
  - Agreement Date
  provenance: atticus_guidelines
  proposer:
    batch_id: null
    harness: claude-code
    invocation: subagent
    model: claude-opus-5
    prompt_version: null
    source_document: CUAD Labeling Handbook (Atticus Project, 2021) + CUAD v1 Datasheet
  evidence:
  - Handbook, Agreement Date, IS list (p.7) — search order is introductory paragraph, then
    cover page, then the later of the signature-page dates, with an explicit instruction not
    to label both signature dates
  - Handbook, Agreement Date, IS-NOT list (p.8) — the execution wording (dated / as of / entered
    into) is excluded from the span, as are dates in headers, footers, recitals and preliminary
    statements
  checker_sketch: 'Applicability: the Agreement Date decision, whenever gold marks the category
    present. Compliance, three conjunctive tests, all programmatic: (1) the predicted span
    list has length 1; (2) the span text does not contain dated / as of / entered into / made
    this; (3) the span''s located character offset does not fall inside a line matching a
    page-furniture pattern (page number, confidential-treatment legend, SEC exhibit header)
    nor inside a sentence beginning with WHEREAS or within a recitals block. Test (3) leans
    on the same furniture patterns D-15 already forces us to characterise, so it costs nothing
    extra. Note the interaction with D-15: gold spans that were split around embedded furniture
    may make test (3) fire on a span that matches gold, so report test (3) separately from
    (1) and (2) rather than collapsing to one boolean.'
  review:
    decision: accept
    reviewer: tyler
    date: '2026-08-16'
    rationale: Excellent
- id: p08
  statement: When the responsive material is not contiguous in the contract — a lead-in plus
    one of several subsections, a clause plus the definition it needs, or two clauses that
    must be read together — the span concatenates only the responsive fragments, in document
    order, separated by the marker "<omitted>", and drops the intervening non-responsive text.
  trigger_guidance: Consider whenever the responsive text sits inside an enumerated list,
    or depends on a defined term or on a date stated elsewhere in the contract.
  type: procedure
  scope: []
  provenance: atticus_guidelines
  proposer:
    batch_id: null
    harness: claude-code
    invocation: subagent
    model: claude-opus-5
    prompt_version: null
    source_document: CUAD Labeling Handbook (Atticus Project, 2021) + CUAD v1 Datasheet
  evidence:
  - Handbook ch.1, subsection rule (p.5) — worked example labels 14.2 and 14.2.10 with the
    marker between them, dropping 14.2.1-14.2.9
  - Handbook ch.1, definitions rule (p.6) — a needed definition is appended after the marker;
    self-evident defined terms are not labelled
  - CUAD Datasheet II-F — same convention, described as manual deletion of the non-responsive
    portion (CC BY 4.0, quotable)
  checker_sketch: 'Applicability: the gold span set for this decision contains at least one
    span containing the literal marker "<omitted>". Compliance: the predicted span set for
    that decision contains at least one span with the marker, AND no predicted span is a contiguous
    substring of the contract that spans both fragments (which would be the "just take the
    whole block" failure). Both halves are pure string work over data we already hold. Cheap
    and unambiguous. Caveat: the marker must appear in the prompt''s task definition or no
    model will ever emit it, which makes this principle a partial test of instruction-following
    rather than of legal judgement.'
  review:
    decision: defer
    reviewer: tyler
    date: '2026-08-16'
    rationale: doesn't apply ever. Confusing since it's from the guidelines so should be followed,
      but since the marker never occurs it's a problem. We should consider removing the requirement
      for a checker so the LLM can consider this instead
